    <text x="432" y="303" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#16243A">S3</text>
    <rect x="508" y="24" width="220" height="320" rx="14" fill="#FFFFFF" stroke="#9FB3D1" stroke-width="2"/>
    <rect x="508" y="24" width="220" height="60" rx="14" fill="#254DB8"/>
    <text x="618" y="62" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Modificação</text>
    <text x="538" y="122" style="font-size:20px;font-weight:700">Antes</text>
