    <rect x="302" y="264" width="60" height="60" rx="8" fill="#FFF1D6" stroke="#B7791F" stroke-width="2"/>
    <text x="332" y="303" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#7A4B0A">S2</text>
