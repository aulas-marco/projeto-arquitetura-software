    <text x="774" y="250" style="font-size:20px;font-weight:700">Depois</text>
    <rect x="774" y="264" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#9FB3D1" stroke-width="2"/>
    <text x="804" y="303" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#16243A">S1</text>
    <rect x="874" y="264" width="60" height="60" rx="8" fill="none" stroke="#9FB3D1" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="36" y="364" width="928" height="72" rx="14" fill="#16243A"/>
    <text x="500" y="408" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Tamanho, custo, recurso e tempo de cada mudança</text>
