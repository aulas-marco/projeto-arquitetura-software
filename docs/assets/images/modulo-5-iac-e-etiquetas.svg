<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">Infraestrutura como código e etiquetas obrigatórias</title>
  <desc id="desc">Fluxo que parte de arquivos declarativos, versionados e revisados, da infraestrutura como código, e permitem recriar os ambientes de desenvolvimento, homologação e produção a partir da mesma descrição. O código aplica as quatro etiquetas obrigatórias: projeto, ambiente, time e centro de custo.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#254DB8"/>
    </marker>
  </defs>
  <rect width="1000" height="690" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">
    <text x="24" y="46" style="font-size:26px;font-weight:700">Da descrição ao ambiente recriado</text>

    <rect x="24" y="90" width="320" height="238" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M24,106 a16,16 0 0 1 16,-16 h288 a16,16 0 0 1 16,16 v64 h-320 z" fill="#254DB8"/>
    <text x="48" y="124" style="font-size:24px;font-weight:700" fill="#FFFFFF">Infraestrutura</text>
    <text x="48" y="154" style="font-size:24px;font-weight:700" fill="#FFFFFF">como código</text>
    <text x="48" y="214" style="font-size:22px">Arquivos declarativos,</text>
    <text x="48" y="246" style="font-size:22px">versionados e</text>
    <text x="48" y="278" style="font-size:22px">revisados</text>

    <g stroke="#254DB8" stroke-width="4" fill="none">
      <line x1="344" y1="209" x2="470" y2="209"/>
      <line x1="470" y1="172" x2="470" y2="302"/>
      <line x1="470" y1="172" x2="598" y2="172" marker-end="url(#seta)"/>
      <line x1="470" y1="237" x2="598" y2="237" marker-end="url(#seta)"/>
      <line x1="470" y1="302" x2="598" y2="302" marker-end="url(#seta)"/>
    </g>
    <text x="788" y="102" text-anchor="middle" style="font-size:21px;font-weight:700" fill="#254DB8">Mesma descrição,</text>
    <text x="788" y="128" text-anchor="middle" style="font-size:21px;font-weight:700" fill="#254DB8">parâmetros diferentes</text>
    <rect x="604" y="144" width="372" height="56" rx="12" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="790" y="181" text-anchor="middle" style="font-size:24px;font-weight:700">Desenvolvimento</text>
    <rect x="604" y="209" width="372" height="56" rx="12" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="790" y="246" text-anchor="middle" style="font-size:24px;font-weight:700">Homologação</text>
    <rect x="604" y="274" width="372" height="56" rx="12" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="790" y="311" text-anchor="middle" style="font-size:24px;font-weight:700">Produção</text>

    <line x1="184" y1="328" x2="184" y2="388" stroke="#254DB8" stroke-width="4" marker-end="url(#seta)"/>
    <text x="204" y="368" style="font-size:21px;font-weight:700" fill="#254DB8">Aplicadas pelo código</text>

    <rect x="24" y="394" width="952" height="270" rx="16" fill="#FFF7E6" stroke="#F2B84B" stroke-width="4"/>
    <text x="48" y="436" style="font-size:25px;font-weight:700">Quatro etiquetas obrigatórias</text>
    <text x="48" y="470" style="font-size:21px">Exigidas por uma política que recusa recurso sem etiqueta</text>
    <rect x="48" y="496" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <text x="153" y="536" text-anchor="middle" style="font-size:23px;font-weight:700">projeto</text>
    <rect x="274" y="496" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <text x="379" y="536" text-anchor="middle" style="font-size:23px;font-weight:700">ambiente</text>
    <rect x="500" y="496" width="210" height="64" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <text x="605" y="536" text-anchor="middle" style="font-size:23px;font-weight:700">time</text>
    <rect x="726" y="496" width="226" height="64" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <text x="839" y="536" text-anchor="middle" style="font-size:23px;font-weight:700">centro de custo</text>
    <text x="48" y="604" style="font-size:21px">Permitem responder quanto custa o ambiente de produção de um serviço</text>
    <text x="48" y="638" style="font-size:21px">e quanto uma equipe consome em homologação</text>
  </g>
</svg>
