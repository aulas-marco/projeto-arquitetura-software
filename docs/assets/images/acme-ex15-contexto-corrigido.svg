<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de contexto corrigido do primeiro ciclo da ACME</title>
<desc id="desc">Três pessoas no alto, aluno, professor e secretaria acadêmica, ligadas ao sistema acadêmico, que aparece como uma caixa única dentro da fronteira tracejada. Abaixo, ligados por um barramento ortogonal, seis sistemas externos fora da fronteira: ERP financeiro, ambiente virtual de aprendizagem, assinador digital ICP-Brasil, gateway de pagamento, provedor de identidade e órgão regulador. O banco de dados não aparece, porque é um contêiner do nível seguinte.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.n{font-size:18px}.l{font-size:16px;fill:#3A4A60}.b{font-size:18px;font-weight:700}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
<rect width="1000" height="540" rx="22" fill="#F2F6FB"/>
<rect x="40" y="30" width="170" height="56" rx="8" fill="#ECEFFF" stroke="#254DB8" stroke-width="2"/>
<text x="125" y="64" text-anchor="middle" class="n">Aluno</text>
<rect x="395" y="30" width="170" height="56" rx="8" fill="#ECEFFF" stroke="#254DB8" stroke-width="2"/>
<text x="480" y="64" text-anchor="middle" class="n">Professor</text>
<rect x="770" y="30" width="200" height="56" rx="8" fill="#ECEFFF" stroke="#254DB8" stroke-width="2"/>
<text x="870" y="64" text-anchor="middle" class="n">Secretaria acadêmica</text>
<rect x="290" y="150" width="380" height="170" rx="12" fill="#E8EBF0" stroke="#7A8799" stroke-width="2" stroke-dasharray="9 6"/>
<text x="306" y="176" class="b">Fronteira da solução</text>
<rect x="380" y="205" width="200" height="80" rx="8" fill="#ECEFFF" stroke="#254DB8" stroke-width="2"/>
<text x="480" y="241" text-anchor="middle" class="n">Sistema acadêmico</text>
<text x="480" y="263" text-anchor="middle" class="l">inclui o núcleo COBOL</text>
<path d="M125 86L125 245L378 245" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="135" y="118" text-anchor="start" class="l">renova matrícula e</text>
<text x="135" y="137" text-anchor="start" class="l">consulta notas</text>
<path d="M480 86L480 203" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="490" y="118" text-anchor="start" class="l">lança notas</text>
<path d="M870 86L870 245L582 245" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="860" y="132" text-anchor="end" class="l">emite documentos</text>
<path d="M480 285L480 360" fill="none" stroke="#52657E" stroke-width="2.2"/>
<path d="M90 360L910 360" fill="none" stroke="#52657E" stroke-width="2.2"/>
<path d="M90 360L90 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="98" y="382" text-anchor="start" class="l">envia</text>
<text x="98" y="401" text-anchor="start" class="l">lançamentos</text>
<rect x="15" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="90" y="474" text-anchor="middle" class="n">ERP</text>
<text x="90" y="496" text-anchor="middle" class="n">financeiro</text>
<path d="M254 360L254 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="262" y="382" text-anchor="start" class="l">publica</text>
<text x="262" y="401" text-anchor="start" class="l">notas</text>
<rect x="179" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="254" y="474" text-anchor="middle" class="n">Ambiente virtual</text>
<text x="254" y="496" text-anchor="middle" class="n">de aprendizagem</text>
<path d="M418 360L418 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="426" y="382" text-anchor="start" class="l">solicita</text>
<text x="426" y="401" text-anchor="start" class="l">assinatura</text>
<rect x="343" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="418" y="474" text-anchor="middle" class="n">Assinador digital</text>
<text x="418" y="496" text-anchor="middle" class="n">ICP-Brasil</text>
<path d="M582 360L582 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="590" y="382" text-anchor="start" class="l">gera</text>
<text x="590" y="401" text-anchor="start" class="l">cobrança</text>
<rect x="507" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="582" y="474" text-anchor="middle" class="n">Gateway de</text>
<text x="582" y="496" text-anchor="middle" class="n">pagamento</text>
<path d="M746 360L746 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="754" y="382" text-anchor="start" class="l">autentica</text>
<text x="754" y="401" text-anchor="start" class="l">usuários</text>
<rect x="671" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="746" y="474" text-anchor="middle" class="n">Provedor de</text>
<text x="746" y="496" text-anchor="middle" class="n">identidade</text>
<path d="M910 360L910 438" fill="none" stroke="#52657E" stroke-width="2.2" marker-end="url(#a)"/>
<text x="918" y="382" text-anchor="start" class="l">envia</text>
<text x="918" y="401" text-anchor="start" class="l">censo</text>
<rect x="835" y="440" width="150" height="78" rx="8" fill="#D9DEE6" stroke="#7A8799" stroke-width="2"/>
<text x="910" y="474" text-anchor="middle" class="n">Órgão</text>
<text x="910" y="496" text-anchor="middle" class="n">regulador</text>
</svg>
