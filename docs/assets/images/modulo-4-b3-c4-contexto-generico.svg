<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de contexto genérico em C4</title><desc id="desc">Diagrama de contexto com três elementos lado a lado. A pessoa Cliente interage com o Sistema Principal por HTTPS, e o Sistema Principal realiza chamadas REST com JSON ao Serviço de API Externa, marcado como sistema externo em cinza. As relações são linhas retas com o rótulo e o protocolo acima de cada uma.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.tag{font-size:16px;font-style:italic;fill:#E6EEF9}.nm{font-size:20px;font-weight:700;fill:white}.tc{font-size:16px;font-style:italic;fill:#D8E9FF}.ds{font-size:17px;fill:white}.lb{font-size:16px;font-weight:700;fill:#3A4A60}.lt{font-size:16px;font-style:italic;fill:#52657E}.bd{font-size:20px;font-weight:700;fill:#16243A}.bt{font-size:16px;fill:#52657E}.h{font-size:24px;font-weight:700;fill:#16243A}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
  <rect width="1000" height="300" rx="24" fill="#F2F6FB"/>
  <text x="24" y="40" class="h">Diagrama de contexto</text>
  <circle cx="145.0" cy="86" r="24" fill="#16243A"/>
  <rect x="30" y="102" width="230" height="168" rx="22" fill="#16243A"/>
  <text x="145.0" y="142" text-anchor="middle" class="tag">«pessoa»</text>
  <text x="145.0" y="164" text-anchor="middle" class="nm">Cliente</text>
  <text x="145.0" y="196" text-anchor="middle" class="ds">Usuário que usa o</text>
  <text x="145.0" y="218" text-anchor="middle" class="ds">sistema para tarefas</text>
  <text x="145.0" y="240" text-anchor="middle" class="ds">e serviços</text>
  <rect x="385" y="90" width="230" height="180" rx="10" fill="#254DB8"/>
  <text x="500.0" y="136" text-anchor="middle" class="tag">«sistema»</text>
  <text x="500.0" y="158" text-anchor="middle" class="nm">Sistema Principal</text>
  <text x="500.0" y="190" text-anchor="middle" class="ds">Atende às</text>
  <text x="500.0" y="212" text-anchor="middle" class="ds">necessidades</text>
  <text x="500.0" y="234" text-anchor="middle" class="ds">do cliente</text>
  <rect x="740" y="90" width="230" height="180" rx="10" fill="#7A8799"/>
  <text x="855.0" y="134" text-anchor="middle" class="tag">«sistema externo»</text>
  <text x="855.0" y="156" text-anchor="middle" class="nm">Serviço de</text>
  <text x="855.0" y="181" text-anchor="middle" class="nm">API Externa</text>
  <text x="855.0" y="214" text-anchor="middle" class="ds">Complementa as</text>
  <text x="855.0" y="236" text-anchor="middle" class="ds">funcionalidades</text>
  <path d="M260 190L383 190" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="322" y="158" text-anchor="middle" class="lb">Interage com</text>
  <text x="322" y="178" text-anchor="middle" class="lt">[HTTPS]</text>
  <path d="M615 190L738 190" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="677" y="138" text-anchor="middle" class="lb">Realiza</text>
  <text x="677" y="158" text-anchor="middle" class="lb">chamadas</text>
  <text x="677" y="178" text-anchor="middle" class="lt">[REST/JSON]</text>
</svg>
