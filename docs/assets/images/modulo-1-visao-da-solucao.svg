<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Uma solução como sistema completo</title><desc id="desc">Uma necessidade de negócio é atendida por cinco componentes conectados: pessoas, estrutura, processos, informação e tecnologia.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.k{font-size:15px;font-weight:600}.s{font-size:13px;fill:#52657E}.box{stroke:#254DB8;stroke-width:2}.line{stroke:#254DB8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><path d="M80 95H1120M80 582H1120" stroke="#D8E5F1" stroke-width="2"/>
  <text x="80" y="65" class="h">Uma solução resolve o problema pelo conjunto</text><text x="80" y="88" class="s">A qualidade emerge da interação, não da soma de peças isoladas.</text>
  <rect x="462" y="145" width="276" height="83" rx="16" fill="#16243A"/><text x="600" y="178" text-anchor="middle" style="font-size:18px;font-weight:700;fill:white">Necessidade de negócio</text><text x="600" y="203" text-anchor="middle" style="font-size:14px;fill:#D7E7FF">Nota disponível em minutos</text>
  <path d="M535 228L294 300M665 228L906 300M485 228L210 432M715 228L990 432M600 228V452" class="line"/>
  <g><rect x="105" y="286" width="220" height="98" rx="16" fill="#EAF8FB" class="box"/><circle cx="143" cy="326" r="19" fill="#5FC0D1"/><path d="M135 334q8-15 16 0M143 309v17" stroke="#16243A" stroke-width="3" fill="none"/><text x="174" y="323" class="k">Pessoas</text><text x="174" y="347" class="s">professor e estudante</text></g>
  <g><rect x="875" y="286" width="220" height="98" rx="16" fill="#FFF5DE" class="box"/><rect x="913" y="309" width="35" height="38" rx="3" fill="#F2B84B"/><path d="M919 309v-11h23v11M923 321h15M923 332h15" stroke="#16243A" stroke-width="3" fill="none"/><text x="966" y="323" class="k">Estrutura</text><text x="966" y="347" class="s">Secretaria Acadêmica</text></g>
  <g><rect x="80" y="418" width="260" height="102" rx="16" fill="#EAF0FF" class="box"/><path d="M112 451h47m-16-14 16 14-16 14M112 487h47m-16-14 16 14-16 14" class="line"/><text x="184" y="457" class="k">Processos</text><text x="184" y="482" class="s">lançar, conferir, publicar</text></g>
  <g><rect x="860" y="418" width="260" height="102" rx="16" fill="#EAF0FF" class="box"/><path d="M892 452l21-13 21 13v25l-21 13-21-13Z" fill="#254DB8"/><text x="963" y="457" class="k">Informação</text><text x="963" y="482" class="s">nota, auditoria e retorno</text></g>
  <g><rect x="465" y="450" width="270" height="110" rx="16" fill="#DCE8FF" class="box"/><rect x="498" y="476" width="48" height="38" rx="5" fill="white" stroke="#254DB8" stroke-width="3"/><path d="M506 525h32M522 514v11" stroke="#254DB8" stroke-width="3"/><path d="M559 490h142M559 505h105" stroke="#5FC0D1" stroke-width="5"/><text x="600" y="542" text-anchor="middle" class="k">Tecnologia e integração</text></g>
  <path d="M600 560V600" class="line"/><rect x="392" y="603" width="416" height="45" rx="22" fill="#254DB8"/><text x="600" y="632" text-anchor="middle" style="font-size:16px;font-weight:700;fill:white">Resultado percebido pelo aluno</text>
</svg>
