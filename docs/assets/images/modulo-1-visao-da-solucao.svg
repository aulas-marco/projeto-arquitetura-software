<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Atlas visual da modernização da ACME</title><desc id="d">Quatro leituras do mesmo caso conectam escopo das decisões, solução completa, responsabilidade do arquiteto e fases do processo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:26px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52657E}.n{font-size:13px;font-weight:700;fill:#254DB8}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Atlas ACME: uma modernização lida por quatro lentes</text><text x="80" y="89" class="s">A Aula 1 usa o mesmo caso para decidir, desenhar, atribuir responsabilidade e planejar a mudança.</text><rect x="80" y="126" width="1040" height="72" rx="18" fill="#16243A"/><text x="600" y="157" text-anchor="middle" style="font-size:17px;font-weight:700;fill:white">Problema ACME: modernizar o sistema acadêmico sem parar a matrícula</text><text x="600" y="180" text-anchor="middle" style="font-size:13px;fill:#D7E7FF">A propagação de nota, hoje em lote diário, precisa atender ao requisito R7.</text><g><rect x="80" y="262" width="230" height="190" rx="20" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><text x="108" y="300" class="t">1. Escopo</text><text x="108" y="328" class="n">D1 · D2 · D3</text><text x="108" y="354" class="s">Quem decide?</text><text x="108" y="375" class="s">Corporativa, solução</text><text x="108" y="396" class="s">ou software.</text></g><g><rect x="350" y="262" width="230" height="190" rx="20" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><text x="378" y="300" class="t">2. Sistema</text><text x="378" y="328" class="n">R7 · até 10 min</text><text x="378" y="354" class="s">O que muda em pessoas,</text><text x="378" y="375" class="s">processos, informação</text><text x="378" y="396" class="s">e tecnologia?</text></g><g><rect x="620" y="262" width="230" height="190" rx="20" fill="#FFF5DE" stroke="#F2B84B" stroke-width="3"/><text x="648" y="300" class="t">3. Responsabilidade</text><text x="648" y="328" class="n">T1 ··· T10</text><text x="648" y="354" class="s">Qual decisão cabe ao</text><text x="648" y="375" class="s">arquiteto de solução,</text><text x="648" y="396" class="s">software ou corporativo?</text></g><g><rect x="890" y="262" width="230" height="190" rx="20" fill="#EAF0FF" stroke="#254DB8" stroke-width="3"/><text x="918" y="300" class="t">4. Processo</text><text x="918" y="328" class="n">A1 ··· A10</text><text x="918" y="354" class="s">Qual artefato entra,</text><text x="918" y="375" class="s">é produzido ou valida</text><text x="918" y="396" class="s">cada fase?</text></g><path d="M310 357H350M580 357H620M850 357H890" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><path d="M600 198V526" stroke="#B8CEE4" stroke-width="3" stroke-dasharray="8 8"/><rect x="335" y="545" width="530" height="58" rx="22" fill="#254DB8"/><text x="600" y="571" text-anchor="middle" style="font-size:16px;font-weight:700;fill:white">Resultado: solução implementável e governada</text><text x="600" y="591" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">desenho, roteiro de entrega e estimativa de mudança</text></svg>
