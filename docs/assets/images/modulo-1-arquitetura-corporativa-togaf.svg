<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Decisões da ACME do TOGAF ao software</title><desc id="d">Os domínios corporativos do TOGAF estabelecem diretrizes. D1 é uma política corporativa transversal, D2 é uma decisão de solução e D3 uma decisão de software.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:14px;font-weight:700;fill:white}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Uma decisão ACME atravessa escopos, do TOGAF ao componente</text><text x="80" y="89" class="s">Leitura didática dos domínios de arquitetura corporativa e de como eles restringem uma solução concreta.</text><rect x="80" y="120" width="1040" height="210" rx="24" fill="white" stroke="#16243A" stroke-width="3"/><text x="110" y="154" class="t">Arquitetura corporativa · domínios do TOGAF</text><text x="600" y="174" text-anchor="middle" class="s">D1: identidade e autorização por padrões abertos · diretriz corporativa transversal</text><g><rect x="110" y="190" width="220" height="95" rx="15" fill="#FFF5DE"/><text x="134" y="222" class="t">Negócio</text><text x="134" y="245" class="s">papéis e política</text><text x="134" y="265" class="s">acadêmica</text></g><g><rect x="350" y="190" width="220" height="95" rx="15" fill="#EAF8FB"/><text x="374" y="222" class="t">Dados</text><text x="374" y="245" class="s">propriedade e</text><text x="374" y="265" class="s">proteção do aluno</text></g><g><rect x="590" y="190" width="220" height="95" rx="15" fill="#EAF0FF"/><text x="614" y="222" class="t">Aplicações</text><text x="614" y="245" class="s">portfólio, interfaces</text><text x="614" y="265" class="s">e padrões de integração</text></g><g><rect x="830" y="190" width="220" height="95" rx="15" fill="#E6EEF9"/><text x="854" y="222" class="t">Tecnologia</text><text x="854" y="245" class="s">plataforma, rede,</text><text x="854" y="265" class="s">segurança e operação</text></g><path d="M220 285V368M460 285V368M700 285V368M940 285V368" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="373" width="840" height="92" rx="20" fill="#254DB8"/><text x="600" y="405" text-anchor="middle" class="w">Arquitetura de solução · D2</text><text x="600" y="429" text-anchor="middle" style="font-size:13px;fill:#D7E7FF">A nota chega ao ambiente virtual em até 10 minutos, com impacto em processo, papéis e integração.</text><path d="M600 465V514" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><rect x="325" y="520" width="550" height="84" rx="20" fill="#16243A"/><text x="600" y="552" text-anchor="middle" class="w">Arquitetura de software · D3</text><text x="600" y="576" text-anchor="middle" style="font-size:13px;fill:#D7E7FF">O serviço de notas repete o envio quando o destino não confirma.</text><text x="600" y="639" text-anchor="middle" class="s">Gestão de requisitos conecta visão corporativa, solução e implementação sem deslocar a autoridade da decisão.</text></svg>
