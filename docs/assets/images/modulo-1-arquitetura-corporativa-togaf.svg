<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura corporativa com domínios alinhados ao TOGAF</title><desc id="desc">A visão de arquitetura e a gestão contínua de requisitos orientam os domínios de negócio, dados, aplicações e tecnologia, que fornecem diretrizes para a arquitetura de solução.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:14px;font-weight:700;fill:white}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Arquitetura corporativa: domínios alinhados ao TOGAF</text><text x="80" y="89" class="s">Visão e requisitos orientam os domínios de arquitetura que estabelecem diretrizes reutilizáveis.</text>
  <rect x="77" y="118" width="1046" height="460" rx="26" fill="white" stroke="#16243A" stroke-width="3"/>
  <rect x="420" y="147" width="360" height="64" rx="15" fill="#16243A"/><text x="600" y="175" text-anchor="middle" class="w">Visão de arquitetura</text><text x="600" y="196" text-anchor="middle" fill="#D7E7FF" style="font-size:12px">direção, princípios e resultado pretendido</text>
  <path d="M447 211L298 278M535 211L483 278M665 211L717 278M753 211L902 278" stroke="#254DB8" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <g><rect x="150" y="278" width="218" height="130" rx="18" fill="#FFF5DE" stroke="#F2B84B" stroke-width="3"/><circle cx="189" cy="326" r="20" fill="#F2B84B"/><path d="M179 332q10-20 20 0M189 307v19" fill="none" stroke="#16243A" stroke-width="3"/><text x="222" y="316" class="t">Negócio</text><text x="222" y="338" class="s">capacidade, processo,</text><text x="222" y="356" class="s">papel e política</text></g>
  <g><rect x="382" y="278" width="218" height="130" rx="18" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><path d="M418 309h39v13h-39zM418 329h39v13h-39zM418 349h39v13h-39z" fill="#5FC0D1"/><text x="476" y="316" class="t">Dados</text><text x="476" y="338" class="s">entidades e qualidade</text><text x="476" y="356" class="s">integração e acesso</text></g>
  <g><rect x="614" y="278" width="218" height="130" rx="18" fill="#EAF0FF" stroke="#254DB8" stroke-width="3"/><rect x="651" y="307" width="42" height="45" rx="5" fill="#254DB8"/><path d="M659 318h26M659 329h26M659 340h16" stroke="white" stroke-width="3"/><text x="710" y="316" class="t">Aplicações</text><text x="710" y="338" class="s">serviços, interfaces,</text><text x="710" y="356" class="s">portfólio e padrões</text></g>
  <g><rect x="846" y="278" width="218" height="130" rx="18" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><path d="M882 340h43M887 340v-19h33v19M900 321v-15h8v15" fill="none" stroke="#16243A" stroke-width="3"/><text x="942" y="316" class="t">Tecnologia</text><text x="942" y="338" class="s">plataforma, segurança,</text><text x="942" y="356" class="s">rede e operação</text></g>
  <path d="M259 409V455M491 409V455M723 409V455M955 409V455" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><rect x="347" y="457" width="506" height="73" rx="18" fill="#254DB8"/><text x="600" y="486" text-anchor="middle" class="w">Arquitetura de solução</text><text x="600" y="508" text-anchor="middle" fill="#D7E7FF" style="font-size:13px">refina as diretrizes no contexto de uma mudança concreta</text>
  <path d="M120 528C96 447 105 232 191 181" fill="none" stroke="#5FC0D1" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="96" y="340" transform="rotate(-90 96 340)" style="font-size:13px;font-weight:700;fill:#254DB8">Gestão de requisitos</text><text x="600" y="622" text-anchor="middle" class="s">Leitura didática: domínios de arquitetura e ciclos de visão e requisitos do TOGAF, sem reproduzir uma notação oficial.</text>
</svg>
