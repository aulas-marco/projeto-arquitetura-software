<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
  <title id="title">Autoridade de design de segurança</title>
  <desc id="desc">Da entrada à saída: o desenho da solução recebe dois testes, a conformidade com as diretivas e o teste de vulnerabilidade, e resulta numa avaliação com recomendações. Abaixo, os três papéis da matriz RACI.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#254DB8"/>
    </marker>
  </defs>
  <rect width="1000" height="1110" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">
    <text x="24" y="46" style="font-size:26px;font-weight:700">Autoridade de design de segurança</text>

    <rect x="24" y="76" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="48" y="108" style="font-size:21px;font-weight:700" fill="#254DB8">Entrada</text>
    <text x="48" y="140" style="font-size:25px;font-weight:700">Desenho da solução</text>

    <g stroke="#254DB8" stroke-width="4">
      <line x1="256" y1="156" x2="256" y2="206" marker-end="url(#seta)"/>
      <line x1="744" y1="156" x2="744" y2="206" marker-end="url(#seta)"/>
    </g>

    <rect x="24" y="212" width="464" height="206" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M24,228 a16,16 0 0 1 16,-16 h432 a16,16 0 0 1 16,16 v44 h-464 z" fill="#254DB8"/>
    <text x="48" y="251" style="font-size:24px;font-weight:700" fill="#FFFFFF">Conformidade com as diretivas</text>
    <text x="48" y="310" style="font-size:21px">audita o desenho contra os</text>
    <text x="48" y="340" style="font-size:21px">princípios, as políticas e os padrões</text>
    <text x="48" y="370" style="font-size:21px">de segurança adotados pela</text>
    <text x="48" y="400" style="font-size:21px">organização</text>

    <rect x="512" y="212" width="464" height="206" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M512,228 a16,16 0 0 1 16,-16 h432 a16,16 0 0 1 16,16 v44 h-464 z" fill="#254DB8"/>
    <text x="536" y="251" style="font-size:24px;font-weight:700" fill="#FFFFFF">Teste de vulnerabilidade</text>
    <text x="536" y="310" style="font-size:21px">simula ameaças e atividades</text>
    <text x="536" y="340" style="font-size:21px">maliciosas para testar a</text>
    <text x="536" y="370" style="font-size:21px">resistência da solução</text>

    <g stroke="#254DB8" stroke-width="4">
      <line x1="256" y1="418" x2="256" y2="468" marker-end="url(#seta)"/>
      <line x1="744" y1="418" x2="744" y2="468" marker-end="url(#seta)"/>
    </g>

    <rect x="24" y="474" width="952" height="136" rx="16" fill="#FFF7E6" stroke="#F2B84B" stroke-width="4"/>
    <text x="48" y="506" style="font-size:21px;font-weight:700" fill="#254DB8">Saída</text>
    <text x="48" y="540" style="font-size:25px;font-weight:700">Avaliação com recomendações</text>
    <text x="48" y="580" style="font-size:21px">que a equipe de solução e a equipe de arquitetura de infraestrutura executam</text>

    <text x="24" y="670" style="font-size:25px;font-weight:700">Matriz RACI</text>
    <text x="24" y="702" style="font-size:21px">R: responsável pela execução. A: responde pelo resultado e o aprova.</text>
    <text x="24" y="732" style="font-size:21px">C: consultado. I: informado.</text>

    <rect x="24" y="756" width="304" height="330" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M24,770 a14,14 0 0 1 14,-14 h276 a14,14 0 0 1 14,14 v66 h-304 z" fill="#16243A"/>
    <text x="40" y="788" style="font-size:22px;font-weight:700" fill="#FFFFFF">Autoridade de design</text>
    <text x="40" y="818" style="font-size:22px;font-weight:700" fill="#FFFFFF">de segurança</text>
    <text x="40" y="874" style="font-size:26px;font-weight:700" fill="#254DB8">R e A</text>
    <text x="40" y="938" style="font-size:21px">Executa os dois testes</text>
    <text x="40" y="966" style="font-size:21px">e aprova a avaliação</text>
    <text x="40" y="994" style="font-size:21px">final do desenho</text>

    <rect x="348" y="756" width="304" height="330" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M348,770 a14,14 0 0 1 14,-14 h276 a14,14 0 0 1 14,14 v66 h-304 z" fill="#16243A"/>
    <text x="364" y="803" style="font-size:22px;font-weight:700" fill="#FFFFFF">Arquiteto de solução</text>
    <text x="364" y="874" style="font-size:26px;font-weight:700" fill="#254DB8">C e R</text>
    <text x="364" y="902" style="font-size:21px;font-weight:700" fill="#254DB8">pela revisão</text>
    <text x="364" y="938" style="font-size:21px">Apresenta o desenho,</text>
    <text x="364" y="966" style="font-size:21px">fornece ativos e</text>
    <text x="364" y="994" style="font-size:21px">permissões e executa a</text>
    <text x="364" y="1022" style="font-size:21px">revisão recomendada</text>

    <rect x="672" y="756" width="304" height="330" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <path d="M672,770 a14,14 0 0 1 14,-14 h276 a14,14 0 0 1 14,14 v66 h-304 z" fill="#16243A"/>
    <text x="688" y="788" style="font-size:22px;font-weight:700" fill="#FFFFFF">Arquiteto de</text>
    <text x="688" y="818" style="font-size:22px;font-weight:700" fill="#FFFFFF">infraestrutura</text>
    <text x="688" y="874" style="font-size:26px;font-weight:700" fill="#254DB8">C e R</text>
    <text x="688" y="902" style="font-size:21px;font-weight:700" fill="#254DB8">pelas mudanças</text>
    <text x="688" y="938" style="font-size:21px">Informa os controles</text>
    <text x="688" y="966" style="font-size:21px">disponíveis na</text>
    <text x="688" y="994" style="font-size:21px">infraestrutura e executa</text>
    <text x="688" y="1022" style="font-size:21px">as mudanças que cabem</text>
    <text x="688" y="1050" style="font-size:21px">a ela</text>
  </g>
</svg>
