<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Papel do arquiteto de solução</title><desc id="desc">O arquiteto transforma necessidades e restrições em decisões, desenho, roteiro e estimativa, em conversa contínua com partes interessadas.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:15px;font-weight:700;fill:white}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">O arquiteto de solução conecta decisão, desenho e entrega</text><text x="80" y="89" class="s">O papel não é escolher tecnologia isoladamente: é coordenar uma solução viável para o negócio.</text>
  <g><rect x="92" y="166" width="240" height="78" rx="16" fill="#FFF5DE" stroke="#F2B84B" stroke-width="3"/><text x="120" y="198" class="t">Necessidade e estratégia</text><text x="120" y="220" class="s">problema, objetivo e valor</text></g><g><rect x="92" y="285" width="240" height="78" rx="16" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><text x="120" y="317" class="t">Partes interessadas</text><text x="120" y="339" class="s">preocupações e acordos</text></g><g><rect x="92" y="404" width="240" height="78" rx="16" fill="#EAF0FF" stroke="#254DB8" stroke-width="3"/><text x="120" y="436" class="t">Linha de base e restrições</text><text x="120" y="458" class="s">o que existe e o que limita</text></g>
  <path d="M332 205H443M332 324H443M332 443H443" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/>
  <circle cx="600" cy="326" r="137" fill="#16243A"/><circle cx="600" cy="326" r="105" fill="#254DB8"/><path d="M567 343q33-73 66 0M576 278a24 24 0 1 1 48 0a24 24 0 1 1-48 0" fill="#F2B84B"/><text x="600" y="386" text-anchor="middle" class="w">Arquiteto de solução</text><text x="600" y="409" text-anchor="middle" fill="#D7E7FF" style="font-size:12px">coordena e governa escolhas</text>
  <path d="M738 270H835M738 326H835M738 382H835" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/>
  <g><rect x="840" y="228" width="260" height="74" rx="15" fill="white" stroke="#254DB8" stroke-width="3"/><text x="868" y="258" class="t">Desenho implementável</text><text x="868" y="280" class="s">componentes e interfaces</text></g><g><rect x="840" y="315" width="260" height="74" rx="15" fill="white" stroke="#254DB8" stroke-width="3"/><text x="868" y="345" class="t">Roteiro de entrega</text><text x="868" y="367" class="s">sequência, risco e prioridade</text></g><g><rect x="840" y="402" width="260" height="74" rx="15" fill="white" stroke="#254DB8" stroke-width="3"/><text x="868" y="432" class="t">Estimativa de mudança</text><text x="868" y="454" class="s">custo e impacto tecnológico</text></g>
  <g><rect x="160" y="550" width="190" height="37" rx="18" fill="#F2B84B"/><text x="255" y="574" text-anchor="middle" style="font-size:13px;font-weight:700">competência de negócio</text><rect x="370" y="550" width="190" height="37" rx="18" fill="#5FC0D1"/><text x="465" y="574" text-anchor="middle" style="font-size:13px;font-weight:700">competência técnica</text><rect x="580" y="550" width="190" height="37" rx="18" fill="#254DB8"/><text x="675" y="574" text-anchor="middle" style="font-size:13px;font-weight:700;fill:white">competência de entrega</text><rect x="790" y="550" width="190" height="37" rx="18" fill="#16243A"/><text x="885" y="574" text-anchor="middle" style="font-size:13px;font-weight:700;fill:white">competência prática</text></g>
</svg>
