<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Mapa de responsabilidade das tarefas da ACME</title><desc id="d">As tarefas T1 a T10 são posicionadas entre negócio e tecnologia, especificação e implementação, para distinguir o trabalho do arquiteto de solução, do arquiteto de software e da arquitetura corporativa.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.l{font-size:12px;font-weight:700}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Quem decide o quê no ciclo de modernização da ACME?</text><text x="80" y="89" class="s">Posicionar a tarefa pelo alcance evita atribuir decisão organizacional ao time técnico, ou detalhe técnico ao patrocinador.</text><rect x="130" y="145" width="770" height="400" rx="24" fill="white" stroke="#16243A" stroke-width="3"/><path d="M515 170V520M155 345H875" stroke="#B8CEE4" stroke-width="3"/><text x="175" y="190" class="t">Especificação</text><text x="175" y="510" class="t">Implementação</text><text x="165" y="330" transform="rotate(-90 165 330)" class="t">Negócio</text><text x="855" y="330" transform="rotate(90 855 330)" class="t">Tecnologia</text><g><rect x="195" y="205" width="265" height="112" rx="16" fill="#FFF5DE" stroke="#F2B84B" stroke-width="3"/><text x="218" y="235" class="t">Arquiteto de solução</text><text x="218" y="261" class="l">T1 · levantar necessidades</text><text x="218" y="283" class="l">T3 · estimar a mudança</text><text x="218" y="305" class="l">T5 · negociar interfaces</text></g><g><rect x="570" y="205" width="265" height="112" rx="16" fill="#EAF0FF" stroke="#254DB8" stroke-width="3"/><text x="593" y="235" class="t">Arquiteto de software</text><text x="593" y="261" class="l">T2 · consistência com COBOL</text><text x="593" y="283" class="l">T4 · estrutura de dados</text><text x="593" y="305" class="l">T10 · avaliar reúso técnico</text></g><g><rect x="195" y="375" width="265" height="112" rx="16" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><text x="218" y="405" class="t">Arquiteto de solução</text><text x="218" y="431" class="l">T7 · roteiro de extração</text><text x="218" y="453" class="l">T8 · nova responsabilidade</text></g><g><rect x="570" y="375" width="265" height="112" rx="16" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><text x="593" y="405" class="t">Equipe de desenvolvimento</text><text x="593" y="431" class="l">T9 · integração contínua</text><text x="593" y="453" class="l">executa sob a arquitetura</text></g><rect x="940" y="185" width="182" height="186" rx="18" fill="#16243A"/><text x="1031" y="218" text-anchor="middle" style="font-size:15px;font-weight:700;fill:white">Arquitetura</text><text x="1031" y="239" text-anchor="middle" style="font-size:15px;font-weight:700;fill:white">corporativa</text><text x="1031" y="273" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">T6 · política de</text><text x="1031" y="292" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">dados pessoais</text><text x="1031" y="329" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">vale para todas</text><text x="1031" y="348" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">as iniciativas</text><rect x="130" y="585" width="990" height="42" rx="21" fill="#254DB8"/><text x="625" y="612" text-anchor="middle" style="font-size:14px;font-weight:700;fill:white">O arquiteto de solução trabalha na fronteira: transforma contexto de negócio em desenho e roteiro viáveis.</text></svg>
