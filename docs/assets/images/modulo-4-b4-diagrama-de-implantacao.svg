<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de implantação em C4 do sistema de agendamento de uma clínica</title><desc id="desc">Ambiente de produção com um DNS e uma região de provedor de nuvem. Na região, um balanceador de carga distribui as requisições HTTPS para duas zonas de disponibilidade. Cada zona tem um nó do cluster Kubernetes em máquina virtual Linux, com instâncias de contêiner do painel da recepção e do serviço de agenda, e um serviço gerenciado de banco de dados, primário na zona A e réplica na zona B, ligados por replicação.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:26px;font-weight:700}.z{font-size:17px;font-weight:700}.q{font-size:16px;fill:#52657E}.e{font-size:16px}.w{font-size:16px;fill:#D8E9FF}.wb{font-size:17px;font-weight:700;fill:white}.r{font-size:16px;font-weight:700;fill:#254DB8}</style>
  <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16243A"/></marker></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="40" y="44" class="h">Diagrama de implantação</text>
  <rect x="30" y="62" width="1140" height="598" rx="18" fill="none" stroke="#16243A" stroke-width="3"/>
  <text x="48" y="90" class="z">Ambiente de produção</text>
  <rect x="50" y="120" width="170" height="70" rx="12" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="135" y="150" text-anchor="middle" class="z">DNS</text>
  <text x="135" y="172" text-anchor="middle" class="e">nó de infraestrutura</text>
  <rect x="245" y="100" width="910" height="545" rx="16" fill="white" stroke="#254DB8" stroke-width="3"/>
  <text x="262" y="124" class="z">Região do provedor</text>
  <rect x="258" y="330" width="210" height="86" rx="12" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="363" y="364" text-anchor="middle" class="z">Balanceador de carga</text>
  <text x="363" y="388" text-anchor="middle" class="e">nó de infraestrutura</text>
  <path d="M135 190V373H256" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  
  <rect x="500" y="120" width="630" height="235" rx="16" fill="#E6EEF9" stroke="#254DB8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="515" y="144" class="z">Zona de disponibilidade A</text>
  <rect x="515" y="156" width="315" height="188" rx="12" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="530" y="178" class="z">Nó do cluster Kubernetes</text>
  <text x="530" y="198" class="q">máquina virtual Linux</text>
  <rect x="530" y="210" width="285" height="56" rx="10" fill="#254DB8"/>
  <text x="545" y="232" class="w">Instância de contêiner</text>
  <text x="545" y="254" class="wb">Painel da recepção</text>
  <rect x="530" y="278" width="285" height="56" rx="10" fill="#254DB8"/>
  <text x="545" y="300" class="w">Instância de contêiner</text>
  <text x="545" y="322" class="wb">Serviço de agenda</text>
  <path d="M672 266V276" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="845" y="156" width="272" height="188" rx="12" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="858" y="178" class="z">Banco gerenciado</text>
  <text x="858" y="198" class="q">acesso por SQL sobre TLS</text>
  <rect x="858" y="230" width="248" height="84" rx="10" fill="#5FC0D1"/>
  <text x="870" y="254" class="e">Instância de contêiner</text>
  <text x="870" y="277" class="z">Banco de agendamentos</text>
  <text x="870" y="300" class="e">primário</text>
  
  <rect x="500" y="395" width="630" height="235" rx="16" fill="#E6EEF9" stroke="#254DB8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="515" y="419" class="z">Zona de disponibilidade B</text>
  <rect x="515" y="431" width="315" height="188" rx="12" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="530" y="453" class="z">Nó do cluster Kubernetes</text>
  <text x="530" y="473" class="q">máquina virtual Linux</text>
  <rect x="530" y="485" width="285" height="56" rx="10" fill="#254DB8"/>
  <text x="545" y="507" class="w">Instância de contêiner</text>
  <text x="545" y="529" class="wb">Painel da recepção</text>
  <rect x="530" y="553" width="285" height="56" rx="10" fill="#254DB8"/>
  <text x="545" y="575" class="w">Instância de contêiner</text>
  <text x="545" y="597" class="wb">Serviço de agenda</text>
  <path d="M672 541V551" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="845" y="431" width="272" height="188" rx="12" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="858" y="453" class="z">Banco gerenciado</text>
  <text x="858" y="473" class="q">acesso por SQL sobre TLS</text>
  <rect x="858" y="505" width="248" height="84" rx="10" fill="#5FC0D1"/>
  <text x="870" y="529" class="e">Instância de contêiner</text>
  <text x="870" y="552" class="z">Banco de agendamentos</text>
  <text x="870" y="575" class="e">réplica</text>
  <path d="M468 350L528 238" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M468 396L528 513" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="262" y="442" class="r">HTTPS às duas zonas</text>
  <path d="M815 306H856" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M815 581H836V330H856" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <path d="M1106 310H1142V585H1108" stroke="#254DB8" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#s)"/>
  <text x="1125" y="370" text-anchor="end" class="r">replicação</text>
</svg>
