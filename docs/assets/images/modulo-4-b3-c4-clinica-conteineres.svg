<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de contêineres em C4 do sistema de agendamento da clínica</title><desc id="desc">O paciente usa o aplicativo do paciente, em Flutter, e a recepção usa o painel da recepção, aplicação de página única em React, contêineres dentro da fronteira tracejada do sistema de agendamento. Os dois chamam a API do serviço de agenda, em Java com Spring Boot, por HTTPS com JSON. O serviço lê e grava no banco de agendamentos PostgreSQL por SQL sobre TLS e chama por HTTPS com REST a operadora de convênio e o serviço de mensagens, sistemas externos em cinza à direita, fora da fronteira. As relações seguem linhas ortogonais.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.tag{font-size:16px;font-style:italic;fill:#E6EEF9}.nm{font-size:20px;font-weight:700;fill:white}.tc{font-size:16px;font-style:italic;fill:#D8E9FF}.ds{font-size:17px;fill:white}.lb{font-size:16px;font-weight:700;fill:#3A4A60}.lt{font-size:16px;font-style:italic;fill:#52657E}.bd{font-size:20px;font-weight:700;fill:#16243A}.bt{font-size:16px;fill:#52657E}.h{font-size:24px;font-weight:700;fill:#16243A}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
