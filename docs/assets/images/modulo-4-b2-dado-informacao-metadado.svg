<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dado, metadado e informação num registro de consulta</title><desc id="desc">Três cartões mostram o mesmo registro de consulta do Hospital Vale do Pousio. À esquerda, o dado bruto é uma linha de valores separados por ponto e vírgula. No centro, o dicionário de dados, que é o metadado, descreve o nome, o tipo e o significado de cada campo. À direita, a informação é a frase interpretada em contexto, que diz que o paciente faltou à consulta de cardiologia. Setas indicam que o dado interpretado com o metadado produz a informação.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.q{font-size:17px;fill:#52657E}.e{font-size:17px;font-weight:700}.m{font-family:Menlo,Consolas,monospace;font-size:17px}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="70" y="62" class="h">O mesmo registro de consulta em três níveis</text>
  <text x="70" y="86" class="q">Exemplo do Hospital Vale do Pousio, com valores fictícios.</text>

  <rect x="70" y="120" width="320" height="330" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="70" y="120" width="320" height="58" rx="22" fill="#254DB8"/>
  <text x="230" y="157" text-anchor="middle" class="t" style="fill:white">Dado</text>
  <text x="90" y="210" class="q">Representação gravada,</text>
  <text x="90" y="232" class="q">pronta para processamento</text>
  <rect x="90" y="262" width="280" height="110" rx="12" fill="#E6EEF9"/>
  <text x="105" y="295" class="m">2026-10-14;08:30;</text>
  <text x="105" y="323" class="m">CAR-07;P-40213;</text>
  <text x="105" y="351" class="m">F</text>
  <text x="90" y="420" class="q">Sem contexto, não diz nada.</text>

  <rect x="440" y="120" width="320" height="330" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="440" y="120" width="320" height="58" rx="22" fill="#5FC0D1"/>
  <text x="600" y="157" text-anchor="middle" class="t">Metadado</text>
  <text x="460" y="210" class="q">Dicionário de dados,</text>
  <text x="460" y="232" class="q">o dado sobre o dado</text>
  <text x="460" y="272" class="e">data: data da consulta</text>
  <text x="460" y="300" class="e">hora: início agendado</text>
  <text x="460" y="328" class="e">clínica: código CAR-07</text>
  <text x="460" y="356" class="e">paciente: identificador</text>
  <text x="460" y="384" class="e">situação: F = faltou</text>
  <text x="460" y="420" class="q">Regras, tipos e restrições.</text>

  <rect x="810" y="120" width="320" height="330" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="810" y="120" width="320" height="58" rx="22" fill="#F2B84B"/>
  <text x="970" y="157" text-anchor="middle" class="t">Informação</text>
  <text x="830" y="210" class="q">Significado em um contexto</text>
  <rect x="830" y="245" width="280" height="140" rx="12" fill="#FFF4DD" stroke="#F2B84B" stroke-width="2"/>
  <text x="845" y="280" class="e">O paciente P-40213</text>
  <text x="845" y="306" class="e">faltou à consulta da</text>
  <text x="845" y="332" class="e">clínica de cardiologia</text>
  <text x="845" y="358" class="e">em 14/10/2026, às 8h30.</text>
  <text x="830" y="420" class="q">Base para convidar de novo.</text>

  <path d="M392 285h40" stroke="#16243A" stroke-width="3"/>
  <path d="M432 285l-12 -8v16z" fill="#16243A"/>
  <path d="M762 285h40" stroke="#16243A" stroke-width="3"/>
  <path d="M802 285l-12 -8v16z" fill="#16243A"/>

  <rect x="70" y="490" width="1060" height="80" rx="18" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <text x="600" y="524" text-anchor="middle" class="e">O dado interpretado com o metadado produz a informação</text>
  <text x="600" y="552" text-anchor="middle" class="q">A mesma linha, lida com outro dicionário, produziria outra informação.</text>

  <rect x="70" y="600" width="1060" height="44" rx="22" fill="#16243A"/>
  <text x="600" y="628" text-anchor="middle" class="e" style="fill:white">Definições da norma ISO/IEC 2382, adotadas por Lovatt (2021, seção 2.5)</text>
</svg>
