<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de contexto do sistema de internet banking em C4</title><desc id="desc">O Cliente Bancário, à esquerda, consulta saldos e realiza pagamentos usando o Sistema de Internet Banking, no centro. O Internet Banking obtém informações de contas e realiza pagamentos usando o Sistema Mainframe Bancário, acima à direita, e envia e-mails usando o Sistema de E-mail, abaixo à direita, que envia e-mails ao cliente. Mainframe e e-mail aparecem em cinza como sistemas externos, e as relações seguem linhas ortogonais.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.tag{font-size:16px;font-style:italic;fill:#E6EEF9}.nm{font-size:20px;font-weight:700;fill:white}.tc{font-size:16px;font-style:italic;fill:#D8E9FF}.ds{font-size:17px;fill:white}.lb{font-size:16px;font-weight:700;fill:#3A4A60}.lt{font-size:16px;font-style:italic;fill:#52657E}.bd{font-size:20px;font-weight:700;fill:#16243A}.bt{font-size:16px;fill:#52657E}.h{font-size:24px;font-weight:700;fill:#16243A}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
  <rect width="1100" height="600" rx="24" fill="#F2F6FB"/>
  <text x="24" y="40" class="h">Internet banking, nível de contexto</text>
  <circle cx="130.0" cy="206" r="24" fill="#16243A"/>
  <rect x="20" y="222" width="220" height="168" rx="22" fill="#16243A"/>
  <text x="130.0" y="272" text-anchor="middle" class="tag">«pessoa»</text>
  <text x="130.0" y="294" text-anchor="middle" class="nm">Cliente Bancário</text>
  <text x="130.0" y="328" text-anchor="middle" class="ds">Cliente com contas</text>
  <text x="130.0" y="350" text-anchor="middle" class="ds">bancárias pessoais</text>
  <rect x="420" y="210" width="250" height="180" rx="10" fill="#254DB8"/>
  <text x="545.0" y="254" text-anchor="middle" class="tag">«sistema»</text>
  <text x="545.0" y="276" text-anchor="middle" class="nm">Sistema de</text>
  <text x="545.0" y="301" text-anchor="middle" class="nm">Internet Banking</text>
  <text x="545.0" y="334" text-anchor="middle" class="ds">Consulta de contas</text>
  <text x="545.0" y="356" text-anchor="middle" class="ds">e pagamentos</text>
  <rect x="840" y="70" width="240" height="170" rx="10" fill="#7A8799"/>
  <text x="960.0" y="109" text-anchor="middle" class="tag">«sistema externo»</text>
  <text x="960.0" y="131" text-anchor="middle" class="nm">Sistema Mainframe</text>
  <text x="960.0" y="156" text-anchor="middle" class="nm">Bancário</text>
  <text x="960.0" y="189" text-anchor="middle" class="ds">Informações</text>
  <text x="960.0" y="211" text-anchor="middle" class="ds">centrais do banco</text>
  <rect x="840" y="380" width="240" height="150" rx="10" fill="#7A8799"/>
  <text x="960.0" y="422" text-anchor="middle" class="tag">«sistema externo»</text>
  <text x="960.0" y="444" text-anchor="middle" class="nm">Sistema de E-mail</text>
  <text x="960.0" y="476" text-anchor="middle" class="ds">E-mail interno</text>
  <text x="960.0" y="498" text-anchor="middle" class="ds">do banco</text>
  <path d="M240 300L418 300" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="329" y="268" text-anchor="middle" class="lb">Consulta saldos e</text>
  <text x="329" y="288" text-anchor="middle" class="lb">realiza pagamentos</text>
  <path d="M670 255L760 255L760 155L838 155" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="750" y="100" text-anchor="end" class="lb">Obtém dados e</text>
  <text x="750" y="120" text-anchor="end" class="lb">realiza pagamentos</text>
  <path d="M670 345L760 345L760 455L838 455" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="750" y="420" text-anchor="end" class="lb">Envia e-mails</text>
  <text x="750" y="440" text-anchor="end" class="lb">usando</text>
  <path d="M960 530L960 570L130 570L130 392" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="545" y="560" text-anchor="middle" class="lb">Envia e-mails para</text>
</svg>
