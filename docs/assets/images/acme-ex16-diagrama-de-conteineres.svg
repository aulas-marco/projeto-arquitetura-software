<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de contêineres da arquitetura alvo do exercício 16</title><desc id="desc">Três pessoas no alto, professor, aluno e secretaria acadêmica. Dentro da fronteira tracejada do sistema acadêmico, três fileiras de contêineres: Portal do Professor, Aplicativo do aluno e Portal da Secretaria, depois Serviço de notas, Serviço de matrícula e Núcleo transacional COBOL, e por fim o banco do serviço de notas, o banco do serviço de matrícula e o banco Oracle existente. À direita, fora da fronteira, seis sistemas externos empilhados: provedor de identidade, assinador digital ICP-Brasil, ambiente virtual de aprendizagem, gateway de pagamento, ERP financeiro e órgão regulador. As relações seguem linhas ortogonais e estão numeradas de 1 a 15, sem rótulo de comunicação.</desc>
