<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de contêineres do sistema de internet banking em C4</title><desc id="desc">O Cliente Bancário, no topo, acessa a Aplicação Web por HTTPS e consulta saldos e realiza pagamentos pela Aplicação de Página Única e pelo Aplicativo Móvel. A Aplicação Web entrega a aplicação de página única ao navegador. A aplicação de página única e o aplicativo móvel chamam a Aplicação de API por JSON sobre HTTPS, e a API lê e grava no Banco de Dados por SQL. Fora da fronteira tracejada, à esquerda, ficam o Sistema de E-mail, que a API usa para enviar e-mails ao cliente, e o Sistema Mainframe Bancário, que a API chama por XML sobre HTTPS. As relações seguem linhas ortogonais.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.tag{font-size:16px;font-style:italic;fill:#E6EEF9}.nm{font-size:20px;font-weight:700;fill:white}.tc{font-size:16px;font-style:italic;fill:#D8E9FF}.ds{font-size:17px;fill:white}.lb{font-size:16px;font-weight:700;fill:#3A4A60}.lt{font-size:16px;font-style:italic;fill:#52657E}.bd{font-size:20px;font-weight:700;fill:#16243A}.bt{font-size:16px;fill:#52657E}.h{font-size:24px;font-weight:700;fill:#16243A}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
