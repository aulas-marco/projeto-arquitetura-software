  <text x="834" y="1003" text-anchor="end" class="bt">[ambiente]</text>
  <rect x="40" y="330" width="160" height="84" rx="10" fill="white" stroke="#52657E" stroke-width="2"/>
  <text x="120.0" y="362" text-anchor="middle" class="bt" style="font-style:italic">«infraestrutura»</text>
