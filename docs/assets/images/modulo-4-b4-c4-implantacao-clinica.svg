<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1035" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de implantação em C4 do sistema de agendamento da clínica</title><desc id="desc">Ambiente de produção do sistema de agendamento de uma clínica odontológica. No alto, o telefone do paciente executa o aplicativo do paciente e o computador da recepção abre o painel da recepção no navegador. O aplicativo consulta o DNS e os dois clientes enviam requisições HTTPS ao balanceador de carga. Dentro da região do provedor de nuvem, duas zonas de disponibilidade têm cada uma um cluster Kubernetes em máquina virtual Linux com instâncias do painel da recepção e do serviço de agenda, e um banco de agendamentos gerenciado, primário na zona A e réplica na zona B, ligados por replicação. Os serviços de agenda gravam no banco primário por SQL sobre TLS, e o serviço de agenda chama por HTTPS a operadora de convênio e o serviço de mensagens, sistemas externos à direita. As relações seguem linhas ortogonais.</desc>
