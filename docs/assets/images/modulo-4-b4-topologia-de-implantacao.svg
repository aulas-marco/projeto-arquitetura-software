<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Topologia de implantação em duas zonas de disponibilidade</title><desc id="desc">Usuários consultam o DNS, recebem conteúdo estático de uma CDN e enviam requisições a um balanceador de carga dentro de uma região do provedor de nuvem. O balanceador distribui as requisições entre réplicas do serviço em duas zonas de disponibilidade, A e B. O banco primário fica na zona A e é replicado para o banco réplica na zona B. À direita, uma conexão dedicada ou VPN liga a região a um centro de dados local que hospeda um sistema legado. Uma faixa inferior explica que a perda de uma zona não interrompe o serviço quando a outra zona tem capacidade para a carga inteira.</desc>
  <defs>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:20px;font-weight:700}.n{font-size:18px;font-weight:700}.q{font-size:17px;fill:#52657E}.e{font-size:16px}.b{font-size:16px;font-weight:700}</style>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16243A"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="40" y="56" class="h">Topologia de implantação com duas zonas</text>
  <text x="40" y="84" class="q">Nós de rede e de execução de uma solução genérica, do usuário até o centro de dados local.</text>

  <!-- Usuários, DNS e CDN -->
  <rect x="40" y="300" width="140" height="80" rx="18" fill="#16243A"/>
  <text x="110" y="346" text-anchor="middle" class="n" style="fill:white">Usuários</text>
  <rect x="210" y="140" width="160" height="70" rx="14" fill="white" stroke="#254DB8" stroke-width="2.5"/>
  <text x="290" y="170" text-anchor="middle" class="n">DNS</text>
  <text x="290" y="194" text-anchor="middle" class="e">resolve o nome</text>
  <rect x="210" y="470" width="160" height="70" rx="14" fill="white" stroke="#254DB8" stroke-width="2.5"/>
  <text x="290" y="500" text-anchor="middle" class="n">CDN</text>
  <text x="290" y="524" text-anchor="middle" class="e">conteúdo estático</text>
  <path d="M110 300V175H206" fill="none" stroke="#16243A" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M110 380V505H206" fill="none" stroke="#16243A" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="240" y="330" class="b">HTTPS</text>

  <!-- Região -->
  <rect x="400" y="110" width="540" height="480" rx="22" fill="#E6EEF9" stroke="#254DB8" stroke-width="3"/>
  <text x="420" y="140" class="t">Região do provedor</text>
  <rect x="420" y="295" width="135" height="90" rx="14" fill="#254DB8"/>
  <text x="487" y="333" text-anchor="middle" class="b" style="fill:white">Balanceador</text>
  <text x="487" y="356" text-anchor="middle" class="b" style="fill:white">de carga</text>

  <!-- Zona A -->
  <rect x="575" y="155" width="345" height="195" rx="16" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="595" y="181" class="n">Zona de disponibilidade A</text>
  <rect x="595" y="192" width="150" height="54" rx="10" fill="#F2B84B" stroke="#16243A" stroke-width="1.5"/>
  <text x="670" y="214" text-anchor="middle" class="e">Réplica 1</text>
  <text x="670" y="236" text-anchor="middle" class="e">do serviço</text>
  <rect x="760" y="192" width="150" height="54" rx="10" fill="#F2B84B" stroke="#16243A" stroke-width="1.5"/>
  <text x="835" y="214" text-anchor="middle" class="e">Réplica 2</text>
  <text x="835" y="236" text-anchor="middle" class="e">do serviço</text>
  <rect x="595" y="276" width="315" height="54" rx="10" fill="#5FC0D1" stroke="#16243A" stroke-width="1.5"/>
  <text x="752" y="309" text-anchor="middle" class="b">Banco primário</text>

  <!-- Zona B -->
  <rect x="575" y="375" width="345" height="195" rx="16" fill="white" stroke="#16243A" stroke-width="2"/>
  <text x="595" y="401" class="n">Zona de disponibilidade B</text>
  <rect x="595" y="412" width="315" height="54" rx="10" fill="#5FC0D1" stroke="#16243A" stroke-width="1.5"/>
  <text x="752" y="445" text-anchor="middle" class="b">Banco réplica</text>
  <rect x="595" y="482" width="150" height="54" rx="10" fill="#F2B84B" stroke="#16243A" stroke-width="1.5"/>
  <text x="670" y="504" text-anchor="middle" class="e">Réplica 3</text>
  <text x="670" y="526" text-anchor="middle" class="e">do serviço</text>
  <rect x="760" y="482" width="150" height="54" rx="10" fill="#F2B84B" stroke="#16243A" stroke-width="1.5"/>
  <text x="835" y="504" text-anchor="middle" class="e">Réplica 4</text>
  <text x="835" y="526" text-anchor="middle" class="e">do serviço</text>
  <path d="M870 330V408" fill="none" stroke="#16243A" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  <text x="862" y="368" text-anchor="end" class="b">replicação</text>

  <!-- Setas sobre as caixas -->
  <path d="M180 340H416" fill="none" stroke="#16243A" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M555 330H567V218H591" fill="none" stroke="#16243A" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M555 350H567V508H591" fill="none" stroke="#16243A" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Centro de dados local -->
  <text x="1072" y="236" text-anchor="middle" class="b">Conexão dedicada</text>
  <text x="1072" y="258" text-anchor="middle" class="b">ou VPN</text>
  <path d="M940 350H970" fill="none" stroke="#F2B84B" stroke-width="8"/>
  <rect x="970" y="275" width="195" height="150" rx="18" fill="white" stroke="#16243A" stroke-width="2.5"/>
  <text x="1067" y="306" text-anchor="middle" class="n">Centro de dados</text>
  <text x="1067" y="330" text-anchor="middle" class="n">local</text>
  <rect x="990" y="348" width="155" height="54" rx="10" fill="#D8E9FF" stroke="#16243A" stroke-width="1.5"/>
  <text x="1067" y="381" text-anchor="middle" class="e">Sistema legado</text>

  <rect x="40" y="610" width="1125" height="44" rx="22" fill="#16243A"/>
  <text x="602" y="638" text-anchor="middle" class="b" style="fill:white">Se uma zona falhar, a outra continua atendendo, desde que tenha capacidade para a carga inteira</text>
</svg>
