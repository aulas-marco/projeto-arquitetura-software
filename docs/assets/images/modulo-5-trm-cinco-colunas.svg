<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modelo técnico de referência em cinco colunas</title>
  <desc id="desc">No alto, o cabeçalho do modelo técnico de referência em cinco colunas, camada e categoria, padrão ou protocolo, exemplos aprovados, exemplos não aprovados e classificação, com uma linha genérica de exemplo para identidade e acesso. Abaixo, uma legenda em três faixas explica a classificação: verde indica tecnologia preferida e primeira escolha, âmbar indica uso permitido com aprovação e vermelho indica tecnologia proibida em projeto novo, a remover quando houver oportunidade. Um rodapé lembra que a adoção fora da lista aprovada exige ADR com a justificativa do desvio.</desc>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">

    <rect x="40" y="24" width="216" height="88" rx="10" fill="#16243A"/>
    <text x="148" y="62" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Camada e</text>
    <text x="148" y="92" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">categoria</text>

    <rect x="266" y="24" width="216" height="88" rx="10" fill="#16243A"/>
    <text x="374" y="62" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Padrão ou</text>
    <text x="374" y="92" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">protocolo</text>

    <rect x="492" y="24" width="216" height="88" rx="10" fill="#16243A"/>
    <text x="600" y="62" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Exemplos</text>
    <text x="600" y="92" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">aprovados</text>

    <rect x="718" y="24" width="216" height="88" rx="10" fill="#16243A"/>
    <text x="826" y="62" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Exemplos</text>
    <text x="826" y="92" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">não aprovados</text>

    <rect x="944" y="24" width="216" height="88" rx="10" fill="#254DB8"/>
    <text x="1052" y="77" text-anchor="middle" style="font-size:24px;font-weight:700" fill="#FFFFFF">Classificação</text>

    <rect x="40" y="122" width="216" height="104" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="148" y="166" text-anchor="middle" style="font-size:21px">Identidade</text>
    <text x="148" y="194" text-anchor="middle" style="font-size:21px">e acesso</text>

    <rect x="266" y="122" width="216" height="104" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="374" y="166" text-anchor="middle" style="font-size:21px">Protocolo aberto</text>
    <text x="374" y="194" text-anchor="middle" style="font-size:21px">obrigatório</text>

    <rect x="492" y="122" width="216" height="104" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="600" y="166" text-anchor="middle" style="font-size:21px">Atendem</text>
    <text x="600" y="194" text-anchor="middle" style="font-size:21px">ao padrão</text>

    <rect x="718" y="122" width="216" height="104" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="826" y="166" text-anchor="middle" style="font-size:21px">Excluídos, com</text>
    <text x="826" y="194" text-anchor="middle" style="font-size:21px">justificativa</text>

    <rect x="944" y="122" width="216" height="104" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="1052" y="166" text-anchor="middle" style="font-size:21px">Verde, âmbar</text>
    <text x="1052" y="194" text-anchor="middle" style="font-size:21px">ou vermelho</text>

    <text x="40" y="270" style="font-size:24px;font-weight:700">Classificação das tecnologias</text>

    <rect x="40" y="288" width="1120" height="88" rx="12" fill="#FFFFFF" stroke="#2F8F5B" stroke-width="3"/>
    <rect x="40" y="288" width="190" height="88" rx="12" fill="#2F8F5B"/>
    <text x="135" y="341" text-anchor="middle" style="font-size:26px;font-weight:700" fill="#FFFFFF">Verde</text>
    <text x="256" y="325" style="font-size:23px">Preferida, primeira escolha em projeto novo.</text>
    <text x="256" y="356" style="font-size:20px" fill="#3E4F66">Usada sem aprovação adicional.</text>

    <rect x="40" y="386" width="1120" height="88" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <rect x="40" y="386" width="190" height="88" rx="12" fill="#F2B84B"/>
    <text x="135" y="439" text-anchor="middle" style="font-size:26px;font-weight:700">Âmbar</text>
    <text x="256" y="423" style="font-size:23px">Uso permitido mediante aprovação.</text>
    <text x="256" y="454" style="font-size:20px" fill="#3E4F66">Aprovação da arquitetura de infraestrutura ou de outra autoridade.</text>

    <rect x="40" y="484" width="1120" height="88" rx="12" fill="#FFFFFF" stroke="#C0453A" stroke-width="3"/>
    <rect x="40" y="484" width="190" height="88" rx="12" fill="#C0453A"/>
    <text x="135" y="537" text-anchor="middle" style="font-size:26px;font-weight:700" fill="#FFFFFF">Vermelho</text>
    <text x="256" y="521" style="font-size:23px">Proibida em projeto novo, a remover na primeira oportunidade.</text>
    <text x="256" y="552" style="font-size:20px" fill="#3E4F66">No legado, só permanece sob plano de migração documentado.</text>

    <rect x="40" y="590" width="1120" height="58" rx="12" fill="#16243A"/>
    <text x="600" y="627" text-anchor="middle" style="font-size:22px" fill="#FFFFFF">Adoção fora dos exemplos aprovados exige ADR com a justificativa do desvio.</text>
  </g>
</svg>
