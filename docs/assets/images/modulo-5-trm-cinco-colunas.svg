<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modelo técnico de referência em cinco colunas</title>
  <desc id="desc">No alto, o cabeçalho do modelo técnico de referência em cinco colunas, camada e categoria, padrão ou protocolo, exemplos aprovados, exemplos não aprovados e classificação, com uma linha genérica de exemplo para identidade e acesso. Abaixo, uma legenda em três faixas explica a classificação: verde indica tecnologia preferida e primeira escolha, âmbar indica uso permitido com aprovação e vermelho indica tecnologia proibida em projeto novo, a remover quando houver oportunidade. Um rodapé lembra que a adoção fora da lista aprovada exige ADR com a justificativa do desvio.</desc>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">

    <rect x="40" y="36" width="216" height="76" rx="10" fill="#16243A"/>
    <text x="148" y="70" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">Camada e</text>
    <text x="148" y="94" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">categoria</text>

    <rect x="266" y="36" width="216" height="76" rx="10" fill="#16243A"/>
    <text x="374" y="70" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">Padrão ou</text>
    <text x="374" y="94" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">protocolo</text>

    <rect x="492" y="36" width="216" height="76" rx="10" fill="#16243A"/>
    <text x="600" y="70" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">Exemplos</text>
    <text x="600" y="94" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">aprovados</text>

    <rect x="718" y="36" width="216" height="76" rx="10" fill="#16243A"/>
    <text x="826" y="70" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">Exemplos</text>
    <text x="826" y="94" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">não aprovados</text>

    <rect x="944" y="36" width="216" height="76" rx="10" fill="#254DB8"/>
    <text x="1052" y="82" text-anchor="middle" style="font-size:19px;font-weight:700" fill="#FFFFFF">Classificação</text>

    <rect x="40" y="122" width="216" height="110" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="148" y="160" text-anchor="middle" style="font-size:17px">Segurança</text>
    <text x="148" y="186" text-anchor="middle" style="font-size:17px">transversal:</text>
    <text x="148" y="212" text-anchor="middle" style="font-size:17px">identidade e acesso</text>

    <rect x="266" y="122" width="216" height="110" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="374" y="172" text-anchor="middle" style="font-size:17px">protocolo aberto</text>
    <text x="374" y="198" text-anchor="middle" style="font-size:17px">obrigatório</text>

    <rect x="492" y="122" width="216" height="110" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="600" y="172" text-anchor="middle" style="font-size:17px">produtos que</text>
    <text x="600" y="198" text-anchor="middle" style="font-size:17px">atendem ao padrão</text>

    <rect x="718" y="122" width="216" height="110" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="826" y="172" text-anchor="middle" style="font-size:17px">produtos excluídos,</text>
    <text x="826" y="198" text-anchor="middle" style="font-size:17px">com justificativa</text>

    <rect x="944" y="122" width="216" height="110" rx="10" fill="#FFFFFF" stroke="#254DB8" stroke-width="2"/>
    <text x="1052" y="172" text-anchor="middle" style="font-size:17px">verde, âmbar</text>
    <text x="1052" y="198" text-anchor="middle" style="font-size:17px">ou vermelho</text>

    <text x="40" y="282" style="font-size:20px;font-weight:700">Classificação na seção de tecnologias descontinuadas</text>

    <rect x="40" y="300" width="1120" height="84" rx="12" fill="#FFFFFF" stroke="#2F8F5B" stroke-width="3"/>
    <rect x="40" y="300" width="200" height="84" rx="12" fill="#2F8F5B"/>
    <text x="140" y="349" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">Verde</text>
    <text x="270" y="337" style="font-size:19px">Tecnologia preferida, primeira escolha em projeto novo.</text>
    <text x="270" y="364" style="font-size:17px" fill="#52657E">Usada sem aprovação adicional.</text>

    <rect x="40" y="398" width="1120" height="84" rx="12" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <rect x="40" y="398" width="200" height="84" rx="12" fill="#F2B84B"/>
    <text x="140" y="447" text-anchor="middle" style="font-size:22px;font-weight:700">Âmbar</text>
    <text x="270" y="435" style="font-size:19px">Uso permitido mediante aprovação.</text>
    <text x="270" y="462" style="font-size:17px" fill="#52657E">Aprovação da arquitetura de infraestrutura ou de outra autoridade designada.</text>

    <rect x="40" y="496" width="1120" height="84" rx="12" fill="#FFFFFF" stroke="#C0453A" stroke-width="3"/>
    <rect x="40" y="496" width="200" height="84" rx="12" fill="#C0453A"/>
    <text x="140" y="545" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">Vermelho</text>
    <text x="270" y="533" style="font-size:19px">Proibida em projeto novo, a remover quando houver oportunidade.</text>
    <text x="270" y="560" style="font-size:17px" fill="#52657E">No sistema legado, permanece apenas sob plano de migração documentado.</text>

    <rect x="40" y="598" width="1120" height="48" rx="12" fill="#16243A"/>
    <text x="600" y="629" text-anchor="middle" style="font-size:18px" fill="#FFFFFF">Adoção fora dos exemplos aprovados exige ADR com a justificativa do desvio.</text>
  </g>
</svg>
