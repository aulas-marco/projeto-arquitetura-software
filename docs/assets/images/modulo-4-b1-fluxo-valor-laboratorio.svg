<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de valor do diagnóstico laboratorial do hospital</title><desc id="desc">Seis etapas nomeadas por verbos, em duas linhas, da solicitação do exame à comunicação do resultado: solicitar exame, coletar amostra, enviar o pedido, analisar amostra, integrar resultado e comunicar resultado. As etapas 3 e 5 aparecem em âmbar porque dependem hoje de trabalho manual entre o hospital e o laboratório de apoio, a redigitação do pedido no portal do laboratório e a anexação do laudo em PDF ao prontuário.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:19px;font-weight:700}.q{font-size:17px;fill:#52657E}.p{font-size:17px}.e{font-size:16px;font-weight:700}.w{fill:white}.s{font-size:16px}</style><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16243A"/></marker></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="70" y="62" class="h">Fluxo de valor do diagnóstico laboratorial</text>
  <text x="70" y="88" class="q">Da solicitação do exame à comunicação do resultado, com as etapas que dependem de trabalho manual em âmbar.</text>
  <rect x="70" y="135" width="300" height="115" rx="18" fill="white" stroke="#254DB8" stroke-width="3"/>
  <text x="92" y="177" class="t">1. Solicitar exame</text>
  <text x="92" y="210" class="q">Médico registra o pedido</text>
  <text x="92" y="232" class="q">no prontuário eletrônico</text>
  <rect x="450" y="135" width="300" height="115" rx="18" fill="white" stroke="#254DB8" stroke-width="3"/>
  <text x="472" y="177" class="t">2. Coletar amostra</text>
  <text x="472" y="210" class="q">Posto de coleta etiqueta</text>
  <text x="472" y="232" class="q">o tubo com código de barras</text>
  <rect x="830" y="135" width="300" height="115" rx="18" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="852" y="177" class="t">3. Enviar o pedido</text>
  <text x="852" y="210" class="e">Hoje redigitado no portal</text>
  <text x="852" y="232" class="e">web do laboratório</text>
  <rect x="70" y="350" width="300" height="115" rx="18" fill="white" stroke="#254DB8" stroke-width="3"/>
  <text x="92" y="392" class="t">4. Analisar amostra</text>
  <text x="92" y="425" class="q">Laboratório processa</text>
  <text x="92" y="447" class="q">a amostra em equipamento</text>
  <rect x="450" y="350" width="300" height="115" rx="18" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="472" y="392" class="t">5. Integrar resultado</text>
  <text x="472" y="425" class="e">Hoje chega laudo em PDF,</text>
  <text x="472" y="447" class="e">anexado à mão ao prontuário</text>
  <rect x="830" y="350" width="300" height="115" rx="18" fill="#16243A"/>
  <text x="852" y="392" class="t" style="fill:white">6. Comunicar resultado</text>
  <text x="852" y="425" class="q" style="fill:#D8E9FF">Médico e paciente recebem</text>
  <text x="852" y="447" class="q" style="fill:#D8E9FF">aviso no aplicativo</text>
  <path d="M370 192H444" stroke="#16243A" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M750 192H824" stroke="#16243A" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M370 407H444" stroke="#16243A" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M750 407H824" stroke="#16243A" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M980 250V300H220V344" stroke="#16243A" stroke-width="3" fill="none" marker-end="url(#seta)"/>
  <rect x="70" y="545" width="1060" height="44" rx="22" fill="#16243A"/>
  <text x="600" y="573" text-anchor="middle" class="e" style="fill:white">A integração com os laboratórios incide nas etapas 3 e 5, onde o valor espera por trabalho manual</text>
  <text x="70" y="630" class="q">Cada etapa é nomeada por um verbo que descreve o que acontece com o pedido de exame do paciente.</text>
</svg>
