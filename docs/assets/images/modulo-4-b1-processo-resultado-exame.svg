<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Processo de recebimento de resultado de exame em BPMN simplificado</title><desc id="desc">Três raias horizontais, laboratório de apoio, central de exames do hospital e prontuário eletrônico. O laboratório libera o resultado e publica o laudo em PDF no seu portal. A central de exames baixa o laudo, confere paciente e pedido e passa por um gateway que pergunta se há valor crítico. Com valor crítico, a central telefona ao médico responsável antes de anexar o laudo. Sem valor crítico, anexa o laudo diretamente. O prontuário registra o laudo e notifica o médico, e o processo termina com o resultado disponível.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:19px;font-weight:700}.q{font-size:17px;fill:#52657E}.p{font-size:17px}.e{font-size:16px;font-weight:700}.w{fill:white}.s{font-size:16px}</style><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16243A"/></marker></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="50" y="52" class="h">Recebimento de resultado de exame, BPMN simplificado</text>
  <rect x="50" y="80" width="1100" height="160" fill="white" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="240" width="1100" height="200" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="440" width="1100" height="160" fill="white" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="80" width="44" height="520" fill="#16243A"/>
  <text transform="translate(78 160) rotate(-90)" text-anchor="middle" class="p w" font-weight="700">Laboratório</text>
  <text transform="translate(78 340) rotate(-90)" text-anchor="middle" class="p w" font-weight="700">Central de exames</text>
  <text transform="translate(78 520) rotate(-90)" text-anchor="middle" class="p w" font-weight="700">Prontuário</text>
  <circle cx="140" cy="160" r="22" fill="white" stroke="#16243A" stroke-width="3"/>
  <text x="140" y="210" text-anchor="middle" class="s">Resultado</text>
  <text x="140" y="228" text-anchor="middle" class="s">liberado</text>
  <path d="M162 160H188" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <rect x="190" y="125" width="180" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="280" y="155" text-anchor="middle" class="s">Publicar laudo em</text>
  <text x="280" y="176" text-anchor="middle" class="s">PDF no portal</text>
  <path d="M280 195V303" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <rect x="190" y="305" width="180" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="280" y="335" text-anchor="middle" class="s">Baixar laudo</text>
  <text x="280" y="356" text-anchor="middle" class="s">do portal</text>
  <path d="M370 340H398" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <rect x="400" y="305" width="180" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="490" y="335" text-anchor="middle" class="s">Conferir paciente</text>
  <text x="490" y="356" text-anchor="middle" class="s">e pedido</text>
  <path d="M580 340H608" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <path d="M655 295L700 340L655 385L610 340Z" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="655" y="347" text-anchor="middle" class="e">?</text>
  <text x="655" y="408" text-anchor="middle" class="s">Valor</text>
  <text x="655" y="426" text-anchor="middle" class="s">crítico?</text>
  <path d="M655 295V230H748" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <text x="665" y="250" class="e">sim</text>
  <rect x="750" y="195" width="190" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="845" y="225" text-anchor="middle" class="s">Telefonar ao médico</text>
  <text x="845" y="246" text-anchor="middle" class="s">responsável</text>
  <path d="M700 340H738V375H748" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <text x="704" y="370" class="e">não</text>
  <rect x="750" y="345" width="190" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="845" y="375" text-anchor="middle" class="s">Anexar laudo</text>
  <text x="845" y="396" text-anchor="middle" class="s">ao prontuário</text>
  <path d="M940 230H965V340H942" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <path d="M845 415V483" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <rect x="750" y="485" width="190" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="845" y="515" text-anchor="middle" class="s">Registrar laudo e</text>
  <text x="845" y="536" text-anchor="middle" class="s">notificar médico</text>
  <path d="M940 520H1051" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>
  <circle cx="1075" cy="520" r="22" fill="white" stroke="#16243A" stroke-width="6"/>
  <text x="1075" y="568" text-anchor="middle" class="s">Fim: resultado</text>
  <text x="1075" y="586" text-anchor="middle" class="s">disponível</text>
  <text x="50" y="632" class="q">Círculo fino: início. Retângulo: tarefa. Losango: gateway de decisão. Círculo espesso: fim.</text>
</svg>
