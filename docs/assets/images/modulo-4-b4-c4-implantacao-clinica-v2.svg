<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de implantação em C4 do sistema de agendamento da clínica</title><desc id="desc">Ambiente de produção do sistema de agendamento de uma clínica odontológica. No alto, o telefone do paciente executa o aplicativo do paciente e o computador da recepção executa o painel da recepção no navegador. O aplicativo consulta o DNS, e os dois clientes enviam requisições HTTPS ao balanceador de carga, dentro da região do provedor de nuvem. A região tem duas zonas de disponibilidade, cada uma com um nó do cluster Kubernetes em máquina virtual Linux que executa uma instância do serviço de agenda, e um banco de agendamentos gerenciado, primário na zona A e réplica na zona B, ligados por replicação. As instâncias do serviço de agenda gravam no banco primário por SQL sobre TLS e chamam por HTTPS a operadora de convênio e o serviço de mensagens, sistemas externos à direita. As relações seguem linhas ortogonais.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.tag{font-size:16px;font-style:italic;fill:#E6EEF9}.nm{font-size:20px;font-weight:700;fill:white}.tc{font-size:16px;font-style:italic;fill:#D8E9FF}.ds{font-size:17px;fill:white}.lb{font-size:16px;font-weight:700;fill:#3A4A60}.lt{font-size:16px;font-style:italic;fill:#52657E}.bd{font-size:20px;font-weight:700;fill:#16243A}.bt{font-size:16px;fill:#52657E}.h{font-size:24px;font-weight:700;fill:#16243A}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657E"/></marker></defs>
