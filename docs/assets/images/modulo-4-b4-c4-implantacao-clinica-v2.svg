  <text x="250.0" y="936" text-anchor="middle" class="tc">[serviço gerenciado, primário]</text>
  <rect x="445" y="580" width="380" height="410" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="2"/>
  <text x="461" y="608" class="bd" style="font-size:18px">Zona de disponibilidade B</text>
  <text x="461" y="630" class="bt">[nó de implantação]</text>
  <rect x="460" y="640" width="350" height="185" rx="12" fill="#D8E5F1" stroke="#52657E" stroke-width="2"/>
  <text x="476" y="668" class="bd" style="font-size:18px">Nó do cluster Kubernetes</text>
  <text x="476" y="690" class="bt">[máquina virtual Linux]</text>
  <rect x="615" y="710" width="175" height="92" rx="10" fill="#3A6FD8"/>
  <text x="702.5" y="732" text-anchor="middle" class="tag">«contêiner»</text>
  <text x="702.5" y="754" text-anchor="middle" class="nm">Serviço de</text>
  <text x="702.5" y="779" text-anchor="middle" class="nm">agenda</text>
  <path d="M500 874V950A140.0 14 0 0 0 780 950V874A140.0 14 0 0 0 500 874Z" fill="#3A6FD8" stroke="#254DB8" stroke-width="2"/>
