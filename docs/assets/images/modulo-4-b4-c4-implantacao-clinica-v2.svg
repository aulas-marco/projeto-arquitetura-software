  <text x="312.5" y="754" text-anchor="middle" class="nm">Serviço de</text>
  <text x="312.5" y="779" text-anchor="middle" class="nm">agenda</text>
  <path d="M110 874V950A140.0 14 0 0 0 390 950V874A140.0 14 0 0 0 110 874Z" fill="#3A6FD8" stroke="#254DB8" stroke-width="2"/>
