  <text x="36" y="98" class="bd" style="font-size:18px">Telefone do paciente</text>
  <text x="36" y="120" class="bt">[Android ou iOS]</text>
  <rect x="40" y="132" width="220" height="78" rx="10" fill="#3A6FD8"/>
  <text x="150.0" y="160" text-anchor="middle" class="tag">«contêiner»</text>
  <text x="150.0" y="182" text-anchor="middle" class="nm">Aplicativo do paciente</text>
  <rect x="300" y="70" width="260" height="155" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="2"/>
  <text x="316" y="98" class="bd" style="font-size:18px">Computador da recepção</text>
  <text x="316" y="120" class="bt">[navegador web]</text>
  <rect x="320" y="132" width="220" height="78" rx="10" fill="#3A6FD8"/>
  <text x="430.0" y="160" text-anchor="middle" class="tag">«contêiner»</text>
  <text x="430.0" y="182" text-anchor="middle" class="nm">Painel da recepção</text>
  <rect x="20" y="260" width="830" height="840" rx="12" fill="#F7F9FC" stroke="#52657E" stroke-width="2"/>
  <text x="834" y="1066" text-anchor="end" class="bd" style="font-size:18px">Ambiente de produção</text>
  <text x="834" y="1088" text-anchor="end" class="bt">[ambiente]</text>
  <rect x="40" y="295" width="160" height="84" rx="10" fill="white" stroke="#52657E" stroke-width="2"/>
  <text x="120.0" y="327" text-anchor="middle" class="bt" style="font-style:italic">«infraestrutura»</text>
  <text x="120.0" y="353" text-anchor="middle" class="bd" style="font-size:19px">DNS</text>
  <rect x="40" y="395" width="790" height="655" rx="12" fill="#EEF3FA" stroke="#52657E" stroke-width="2"/>
  <text x="814" y="1016" text-anchor="end" class="bd" style="font-size:18px">Região do provedor de nuvem</text>
  <text x="814" y="1038" text-anchor="end" class="bt">[nó de implantação]</text>
  <rect x="360" y="425" width="220" height="84" rx="10" fill="white" stroke="#52657E" stroke-width="2"/>
  <text x="470.0" y="457" text-anchor="middle" class="bt" style="font-style:italic">«infraestrutura»</text>
  <text x="470.0" y="483" text-anchor="middle" class="bd" style="font-size:19px">Balanceador de carga</text>
  <rect x="55" y="580" width="380" height="410" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="2"/>
  <text x="71" y="608" class="bd" style="font-size:18px">Zona de disponibilidade A</text>
  <text x="71" y="630" class="bt">[nó de implantação]</text>
  <rect x="70" y="640" width="350" height="185" rx="12" fill="#D8E5F1" stroke="#52657E" stroke-width="2"/>
  <text x="86" y="668" class="bd" style="font-size:18px">Nó do cluster Kubernetes</text>
