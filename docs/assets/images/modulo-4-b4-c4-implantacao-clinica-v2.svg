  <text x="640.0" y="890" text-anchor="middle" class="tag">«banco de dados»</text>
  <text x="640.0" y="912" text-anchor="middle" class="nm">Banco de agendamentos</text>
  <text x="640.0" y="936" text-anchor="middle" class="tc">[serviço gerenciado, réplica]</text>
  <rect x="900" y="330" width="280" height="140" rx="10" fill="#7A8799"/>
  <text x="1040.0" y="376" text-anchor="middle" class="tag">«sistema externo»</text>
  <text x="1040.0" y="398" text-anchor="middle" class="nm">Operadora de</text>
  <text x="1040.0" y="423" text-anchor="middle" class="nm">convênio</text>
  <rect x="900" y="520" width="280" height="140" rx="10" fill="#7A8799"/>
  <text x="1040.0" y="566" text-anchor="middle" class="tag">«sistema externo»</text>
  <text x="1040.0" y="588" text-anchor="middle" class="nm">Serviço de</text>
  <text x="1040.0" y="613" text-anchor="middle" class="nm">mensagens</text>
  <path d="M100 210L100 293" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="110" y="252" text-anchor="start" class="lb">resolve nome</text>
  <path d="M230 210L230 467L358 467" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="240" y="252" text-anchor="start" class="lb">HTTPS</text>
  <path d="M450 210L450 423" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="460" y="252" text-anchor="start" class="lb">HTTPS</text>
  <path d="M380 509L380 638" fill="none" stroke="#52657E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="370" y="570" text-anchor="end" class="lb">HTTPS</text>
