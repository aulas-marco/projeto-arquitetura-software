<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t d"><title id="t">O arquiteto de solução governa a mudança nas fases E, F, G e H do ciclo ADM</title><desc id="d">Ciclo ADM do TOGAF redesenhado, com a fase preliminar e as fases A a H em círculo e a gestão de requisitos no centro. As fases E, F, G e H aparecem destacadas, cada uma com o papel do arquiteto de solução e uma situação da ACME.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:26px;font-weight:700}.s{font-size:16px;fill:#52657E}.t{font-size:19px;font-weight:700}.b{font-size:16px}.n{font-size:20px;font-weight:700}.w{fill:white}.c{font-size:15px}</style></defs><rect width="1200" height="780" rx="28" fill="#F2F6FB"/><text x="60" y="58" class="h">O arquiteto de solução governa a mudança nas fases E, F, G e H</text><text x="60" y="88" class="s">Ciclo ADM do TOGAF, redesenhado para este curso. As fases em azul são as da governança da mudança.</text><circle cx="330" cy="400" r="160" fill="none" stroke="#C9D6E8" stroke-width="3" stroke-dasharray="6 8"/><circle cx="330" cy="400" r="78" fill="white" stroke="#16243A" stroke-width="2.5"/><text x="330" y="394" text-anchor="middle" class="t">Gestão de</text><text x="330" y="418" text-anchor="middle" class="t">requisitos</text><circle cx="330" cy="240" r="30" fill="white" stroke="#8EA0B8" stroke-width="3"/><text x="330" y="247" text-anchor="middle" class="n">P</text><text x="330" y="199" text-anchor="middle" class="c" style="font-weight:400">Preliminar</text><circle cx="433" cy="277" r="30" fill="white" stroke="#8EA0B8" stroke-width="3"/><text x="433" y="284" text-anchor="middle" class="n">A</text><text x="462" y="247" text-anchor="start" class="c" style="font-weight:400">Visão</text><circle cx="488" cy="372" r="30" fill="white" stroke="#8EA0B8" stroke-width="3"/><text x="488" y="379" text-anchor="middle" class="n">B</text><text x="533" y="369" text-anchor="start" class="c" style="font-weight:400">Negócio</text><circle cx="469" cy="480" r="30" fill="white" stroke="#8EA0B8" stroke-width="3"/><text x="469" y="487" text-anchor="middle" class="n">C</text><text x="508" y="499" text-anchor="start" class="c" style="font-weight:400">Sistemas de</text><text x="508" y="517" text-anchor="start" class="c" style="font-weight:400">informação</text><circle cx="385" cy="550" r="30" fill="white" stroke="#8EA0B8" stroke-width="3"/><text x="385" y="557" text-anchor="middle" class="n">D</text><text x="400" y="599" text-anchor="start" class="c" style="font-weight:400">Tecnologia</text><circle cx="275" cy="550" r="30" fill="#254DB8" stroke="#254DB8" stroke-width="3"/><text x="275" y="557" text-anchor="middle" class="n w">E</text><text x="260" y="590" text-anchor="end" class="c" style="font-weight:700">Oportunidades</text><text x="260" y="608" text-anchor="end" class="c" style="font-weight:700">e soluções</text><circle cx="191" cy="480" r="30" fill="#254DB8" stroke="#254DB8" stroke-width="3"/><text x="191" y="487" text-anchor="middle" class="n w">F</text><text x="152" y="499" text-anchor="end" class="c" style="font-weight:700">Planejamento</text><text x="152" y="517" text-anchor="end" class="c" style="font-weight:700">da migração</text><circle cx="172" cy="372" r="30" fill="#254DB8" stroke="#254DB8" stroke-width="3"/><text x="172" y="379" text-anchor="middle" class="n w">G</text><text x="127" y="360" text-anchor="end" class="c" style="font-weight:700">Governança da</text><text x="127" y="378" text-anchor="end" class="c" style="font-weight:700">implementação</text><circle cx="227" cy="277" r="30" fill="#254DB8" stroke="#254DB8" stroke-width="3"/><text x="227" y="284" text-anchor="middle" class="n w">H</text><text x="198" y="238" text-anchor="end" class="c" style="font-weight:700">Gestão da</text><text x="198" y="256" text-anchor="end" class="c" style="font-weight:700">mudança</text><rect x="690" y="120" width="460" height="136" rx="18" fill="white" stroke="#254DB8" stroke-width="2.5"/><circle cx="730" cy="156" r="21" fill="#254DB8"/><text x="730" y="163" text-anchor="middle" class="n w">E</text><text x="766" y="162" class="t">Escolher entre soluções</text><text x="714" y="198" class="b">Entre as alternativas de plataforma, o</text><text x="714" y="220" class="b">arquiteto leva ao patrocinador a que cabe no</text><text x="714" y="242" class="b">orçamento de R$ 6,2 milhões.</text><rect x="690" y="268" width="460" height="136" rx="18" fill="white" stroke="#254DB8" stroke-width="2.5"/><circle cx="730" cy="304" r="21" fill="#254DB8"/><text x="730" y="311" text-anchor="middle" class="n w">F</text><text x="766" y="310" class="t">Ordenar a migração</text><text x="714" y="346" class="b">Divide a mudança em ondas e respeita o</text><text x="714" y="368" class="b">contrato da fábrica de software, que vai até</text><text x="714" y="390" class="b">30/09/2027.</text><rect x="690" y="416" width="460" height="136" rx="18" fill="white" stroke="#254DB8" stroke-width="2.5"/><circle cx="730" cy="452" r="21" fill="#254DB8"/><text x="730" y="459" text-anchor="middle" class="n w">G</text><text x="766" y="458" class="t">Vigiar a implementação</text><text x="714" y="494" class="b">Confere se a obra segue o desenho e age</text><text x="714" y="516" class="b">quando uma equipe se afasta dele sob pressão</text><text x="714" y="538" class="b">de prazo.</text><rect x="690" y="564" width="460" height="136" rx="18" fill="white" stroke="#254DB8" stroke-width="2.5"/><circle cx="730" cy="600" r="21" fill="#254DB8"/><text x="730" y="607" text-anchor="middle" class="n w">H</text><text x="766" y="606" class="t">Gerir a mudança</text><text x="714" y="642" class="b">Reabre a decisão quando o gatilho do ADR</text><text x="714" y="664" class="b">dispara, por exemplo a nota levar mais de 10</text><text x="714" y="686" class="b">minutos.</text><text x="60" y="752" class="s">Fonte: ciclo ADM do TOGAF, The Open Group. Desenho original para o curso, sem reprodução da figura oficial.</text></svg>