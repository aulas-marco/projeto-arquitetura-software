<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Estilos arquiteturais por força e compromisso</title><desc id="desc">Matriz com sete estilos nas linhas e quatro forças genéricas nas colunas, acoplamento baixo, implantação independente, consistência imediata e simplicidade operacional. Cada célula indica se o estilo tende a favorecer, ser neutro ou prejudicar a força.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.s{font-size:13px;fill:#52657E}.c{font-size:14px;font-weight:700}.r{font-size:15px;font-weight:600}.m{font-size:12px;font-weight:600}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="70" y="62" class="h">Todo estilo favorece algumas forças e cobra outras</text>
  <text x="70" y="86" class="s">Tendência estrutural de cada estilo, antes de qualquer mecanismo compensatório acrescentado ao desenho.</text>
