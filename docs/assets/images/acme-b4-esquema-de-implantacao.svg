<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc">
  <title id="title">Esquema de implantação do sistema acadêmico em produção</title><desc id="desc">Esquema de implantação da Universidade ACME, em ambiente de produção. No alto, o telefone do aluno executa o aplicativo do aluno, e os navegadores de professores e secretaria abrem os portais, ambos fora do ambiente de produção. No ambiente de produção, o nó nuvem aprovada abriga o serviço de matrícula e o serviço de notas, cada um com o próprio banco, e o nó centro de dados da universidade abriga o núcleo transacional COBOL, o banco do núcleo e os portais existentes. Os serviços novos ligam-se ao núcleo por conexão a definir e a um conjunto de sistemas externos, entre eles o ambiente virtual e o ERP financeiro. Tecnologia, capacidade e recuperação são decisões da Aula 5.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:28px;font-weight:700}.t{font-size:22px;font-weight:700}.b{font-size:20px;font-weight:700}.p{font-size:20px}.q{font-size:20px;fill:#52657E}.i{font-size:20px;font-style:italic;fill:#52657E}.w{fill:#fff}.sk{fill:#D8E9FF}</style><marker id='s' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0 0L10 5L0 10z' fill='#16243A'/></marker></defs>
