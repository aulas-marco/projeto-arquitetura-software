<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de capacidades do Hospital Vale do Pousio</title><desc id="desc">Mapa de capacidades em dois níveis do Hospital Vale do Pousio. Quatro capacidades de topo, gestão estratégica, atendimento ao paciente, cuidado clínico e apoio, se decompõem em capacidades menores coloridas como estratégicas, operacionais ou de apoio. A capacidade de comunicação com pacientes, dentro de atendimento ao paciente, aparece marcada como afetada pela solução, com anotação de volume e de competência.</desc>
  <defs>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:19px;font-weight:700}.q{font-size:17px;fill:#52657E}.p{font-size:17px}.e{font-size:16px;font-weight:700}.w{fill:white}</style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="40" y="62" class="h">Mapa de capacidades do Hospital Vale do Pousio</text>

  <rect x="40" y="88" width="22" height="22" rx="5" fill="#254DB8"/><text x="70" y="105" class="p">Estratégica</text>
  <rect x="200" y="88" width="22" height="22" rx="5" fill="#5FC0D1"/><text x="230" y="105" class="p">Operacional</text>
  <rect x="365" y="88" width="22" height="22" rx="5" fill="#E6EEF9" stroke="#52657E" stroke-width="1.5"/><text x="395" y="105" class="p">De apoio</text>
  <rect x="500" y="88" width="22" height="22" rx="5" fill="white" stroke="#F2B84B" stroke-width="5"/><text x="532" y="105" class="p">Afetada pela solução</text>

  <!-- Coluna 1 -->
  <rect x="40" y="130" width="265" height="54" rx="14" fill="#16243A"/>
  <text x="172" y="164" text-anchor="middle" class="t w">Gestão estratégica</text>
  <rect x="55" y="198" width="235" height="64" rx="12" fill="#254DB8"/>
  <text x="172" y="225" text-anchor="middle" class="p w">Planejamento da</text>
  <text x="172" y="248" text-anchor="middle" class="p w">oferta de serviços</text>
  <rect x="55" y="274" width="235" height="64" rx="12" fill="#254DB8"/>
  <text x="172" y="301" text-anchor="middle" class="p w">Gestão da qualidade</text>
  <text x="172" y="324" text-anchor="middle" class="p w">assistencial</text>

  <!-- Coluna 2 -->
  <rect x="325" y="130" width="265" height="54" rx="14" fill="#16243A"/>
  <text x="457" y="164" text-anchor="middle" class="t w">Atendimento ao paciente</text>
  <rect x="340" y="198" width="235" height="64" rx="12" fill="#5FC0D1" stroke="#F2B84B" stroke-width="6"/>
  <text x="457" y="225" text-anchor="middle" class="p" font-weight="700">Comunicação com</text>
  <text x="457" y="248" text-anchor="middle" class="p" font-weight="700">pacientes</text>
  <rect x="340" y="274" width="235" height="64" rx="12" fill="#5FC0D1"/>
  <text x="457" y="301" text-anchor="middle" class="p">Agendamento</text>
  <text x="457" y="324" text-anchor="middle" class="p">de consultas</text>
  <rect x="340" y="350" width="235" height="64" rx="12" fill="#5FC0D1"/>
  <text x="457" y="377" text-anchor="middle" class="p">Gestão da lista</text>
  <text x="457" y="400" text-anchor="middle" class="p">de espera</text>

  <!-- Coluna 3 -->
  <rect x="610" y="130" width="265" height="54" rx="14" fill="#16243A"/>
  <text x="742" y="164" text-anchor="middle" class="t w">Cuidado clínico</text>
  <rect x="625" y="198" width="235" height="64" rx="12" fill="#5FC0D1"/>
  <text x="742" y="225" text-anchor="middle" class="p">Consulta</text>
  <text x="742" y="248" text-anchor="middle" class="p">ambulatorial</text>
  <rect x="625" y="274" width="235" height="64" rx="12" fill="#5FC0D1"/>
  <text x="742" y="301" text-anchor="middle" class="p">Exames</text>
  <text x="742" y="324" text-anchor="middle" class="p">diagnósticos</text>
  <rect x="625" y="350" width="235" height="64" rx="12" fill="#5FC0D1"/>
  <text x="742" y="388" text-anchor="middle" class="p">Internação</text>

  <!-- Coluna 4 -->
  <rect x="895" y="130" width="265" height="54" rx="14" fill="#16243A"/>
  <text x="1027" y="164" text-anchor="middle" class="t w">Apoio</text>
  <rect x="910" y="198" width="235" height="64" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="1.5"/>
  <text x="1027" y="225" text-anchor="middle" class="p">Correspondência</text>
  <text x="1027" y="248" text-anchor="middle" class="p">e impressão</text>
  <rect x="910" y="274" width="235" height="64" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="1.5"/>
  <text x="1027" y="312" text-anchor="middle" class="p">Gestão de pessoas</text>
  <rect x="910" y="350" width="235" height="64" rx="12" fill="#E6EEF9" stroke="#52657E" stroke-width="1.5"/>
  <text x="1027" y="388" text-anchor="middle" class="p">Faturamento</text>

  <!-- Anotação -->
  <path d="M340 230H322V470h18" stroke="#F2B84B" stroke-width="4" fill="none"/>
  <rect x="340" y="440" width="820" height="150" rx="18" fill="white" stroke="#F2B84B" stroke-width="4"/>
  <text x="365" y="476" class="t">Comunicação com pacientes: capacidade afetada</text>
  <text x="365" y="510" class="p"><tspan font-weight="700">Volume:</tspan> hoje limitado às cartas impressas, e o plano amplia</text>
  <text x="365" y="533" class="p">a quantidade de comunicações que o hospital consegue enviar.</text>
  <text x="365" y="563" class="p"><tspan font-weight="700">Competência:</tspan> comunicar por vários canais e no prazo, como o lembrete na véspera.</text>

  <text x="40" y="476" class="q">Capacidade de topo</text>
  <text x="40" y="500" class="q">no cabeçalho escuro,</text>
  <text x="40" y="524" class="q">capacidades menores</text>
  <text x="40" y="548" class="q">abaixo dela.</text>

  <text x="40" y="640" class="q">Fonte: material do curso, com base em Lovatt (2021, seções 2.3.1 e 2.4). As capacidades além da comunicação são ilustrativas.</text>
</svg>
