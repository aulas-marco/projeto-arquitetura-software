<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">R7 antes e depois da mudança de solução</title><desc id="d">O requisito R7 da ACME exige substituir o lote diário por propagação em até dez minutos, alterando pessoas, processos, informação e tecnologia.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:14px;font-weight:700;fill:white}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">R7 da ACME: não basta trocar a integração</text><text x="80" y="89" class="s">O requisito é de resultado: a nota lançada chega ao ambiente virtual em até 10 minutos.</text><g><rect x="80" y="135" width="440" height="252" rx="22" fill="white" stroke="#16243A" stroke-width="3"/><text x="112" y="170" class="t">Situação atual · lote diário</text><rect x="114" y="205" width="105" height="48" rx="12" fill="#FFF5DE"/><text x="166" y="235" text-anchor="middle" class="t">Professor</text><rect x="260" y="205" width="74" height="48" rx="12" fill="#E6EEF9"/><text x="297" y="235" text-anchor="middle" style="font-size:12px;font-weight:700">Nota</text><rect x="260" y="294" width="150" height="48" rx="12" fill="#EAF0FF"/><text x="335" y="324" text-anchor="middle" style="font-size:13px;font-weight:700">Lote noturno</text><rect x="430" y="294" width="58" height="48" rx="12" fill="#DCE8FF"/><text x="459" y="324" text-anchor="middle" style="font-size:12px;font-weight:700">AVA</text><path d="M219 229H260M297 253V294M410 318H430" stroke="#254DB8" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="114" y="365" class="s">Espera até 24 h: tecnologia nova sobre processo antigo não reduz o prazo percebido.</text></g><path d="M544 263H644" stroke="#F2B84B" stroke-width="6" marker-end="url(#a)"/><text x="594" y="244" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#254DB8">mudança R7</text><g><rect x="680" y="135" width="440" height="252" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/><text x="712" y="170" class="t">Solução alvo · até 10 minutos</text><rect x="714" y="205" width="90" height="48" rx="12" fill="#FFF5DE"/><text x="759" y="235" text-anchor="middle" class="t">Professor</text><rect x="845" y="205" width="75" height="48" rx="12" fill="#5FC0D1"/><text x="882" y="235" text-anchor="middle" style="font-size:12px;font-weight:700">Evento</text><rect x="820" y="294" width="140" height="48" rx="12" fill="#DCE8FF"/><text x="890" y="324" text-anchor="middle" style="font-size:12px;font-weight:700">Mensageria</text><rect x="1000" y="294" width="82" height="48" rx="12" fill="#EAF0FF"/><text x="1041" y="324" text-anchor="middle" style="font-size:12px;font-weight:700">AVA</text><path d="M804 229H845M882 253V294M960 318H1000" stroke="#254DB8" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1041 342V365H890V342" stroke="#5FC0D1" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="958" y="380" text-anchor="middle" class="s">Confirmação e auditoria</text></g><g><rect x="80" y="440" width="1040" height="142" rx="22" fill="#E6EEF9" stroke="#5FC0D1" stroke-width="3"/><text x="112" y="472" class="t">Inventário da mudança</text><text x="112" y="505" class="w" style="fill:#16243A">Pessoas</text><text x="205" y="505" class="s">professor lança nota</text><text x="405" y="505" class="w" style="fill:#16243A">Processo</text><text x="500" y="505" class="s">conferir e publicar sem janela noturna</text><text x="812" y="505" class="w" style="fill:#16243A">Informação</text><text x="915" y="505" class="s">evento e auditoria</text><text x="112" y="543" class="w" style="fill:#16243A">Estrutura</text><text x="205" y="543" class="s">responsável pelo acordo com AVA</text><text x="530" y="543" class="w" style="fill:#16243A">Tecnologia</text><text x="634" y="543" class="s">API, mensageria e retentativa</text></g><text x="600" y="625" text-anchor="middle" class="s">Os três níveis aparecem juntos: resultado do negócio, trabalho das pessoas e automação do sistema de TI.</text></svg>
