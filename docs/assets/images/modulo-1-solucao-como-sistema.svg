<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Três níveis de uma solução e cinco tipos de componente</title><desc id="desc">Um fluxo de nota percorre sistemas de negócio, informação e TI, enquanto uma lista de verificação mostra pessoas, estruturas, processos, informação e tecnologia.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:14px;font-weight:700;fill:white}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">A solução como sistema: níveis e componentes</text><text x="80" y="89" class="s">O mesmo resultado exige coordenação entre negócio, informação e TI.</text>
  <rect x="80" y="120" width="680" height="465" rx="26" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><text x="112" y="155" class="t">Três níveis encaixados</text>
  <rect x="112" y="180" width="615" height="358" rx="22" fill="#DCE8FF" stroke="#254DB8" stroke-width="3"/><text x="140" y="213" class="t">Sistema de negócio</text><text x="140" y="234" class="s">matrícula e avaliação atendem o estudante</text>
  <rect x="158" y="257" width="523" height="235" rx="20" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><text x="187" y="288" class="t">Sistema de informação</text><text x="187" y="309" class="s">pessoas, processos manuais e registros coordenam a atividade</text>
  <rect x="205" y="332" width="430" height="113" rx="18" fill="white" stroke="#16243A" stroke-width="3"/><text x="235" y="363" class="t">Sistema de TI</text><text x="235" y="385" class="s">portal, núcleo acadêmico, mensageria e ambiente virtual</text>
  <rect x="240" y="400" width="83" height="24" rx="12" fill="#F2B84B"/><text x="282" y="417" text-anchor="middle" style="font-size:11px;font-weight:700">lançar nota</text><path d="M330 412H398M398 412H466M466 412H533" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><rect x="401" y="400" width="65" height="24" rx="12" fill="#5FC0D1"/><text x="433" y="417" text-anchor="middle" style="font-size:11px;font-weight:700">evento</text><rect x="534" y="400" width="72" height="24" rx="12" fill="#254DB8"/><text x="570" y="417" text-anchor="middle" fill="white" style="font-size:11px;font-weight:700">publicar</text>
  <rect x="798" y="120" width="322" height="465" rx="26" fill="white" stroke="#254DB8" stroke-width="3"/><text x="830" y="157" class="t">Checklist de completude</text><text x="830" y="178" class="s">Uma mudança pode afetar cinco tipos.</text>
  <g><rect x="825" y="205" width="268" height="51" rx="12" fill="#FFF5DE"/><circle cx="852" cy="230" r="13" fill="#F2B84B"/><text x="878" y="226" class="t">Pessoas</text><text x="878" y="244" class="s">quem atua e aprende</text></g><g><rect x="825" y="266" width="268" height="51" rx="12" fill="#E6EEF9"/><circle cx="852" cy="291" r="13" fill="#254DB8"/><text x="878" y="287" class="t">Estruturas</text><text x="878" y="305" class="s">quem responde e decide</text></g><g><rect x="825" y="327" width="268" height="51" rx="12" fill="#EAF8FB"/><circle cx="852" cy="352" r="13" fill="#5FC0D1"/><text x="878" y="348" class="t">Processos</text><text x="878" y="366" class="s">como o trabalho acontece</text></g><g><rect x="825" y="388" width="268" height="51" rx="12" fill="#EAF0FF"/><circle cx="852" cy="413" r="13" fill="#254DB8"/><text x="878" y="409" class="t">Informação</text><text x="878" y="427" class="s">o que circula e permanece</text></g><g><rect x="825" y="449" width="268" height="51" rx="12" fill="#DCE8FF"/><circle cx="852" cy="474" r="13" fill="#16243A"/><text x="878" y="470" class="t">Tecnologia</text><text x="878" y="488" class="s">o que automatiza e integra</text></g>
</svg>
