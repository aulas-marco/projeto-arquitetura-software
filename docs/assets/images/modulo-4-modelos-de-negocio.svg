<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modelos de arquitetura de negócio e ciclo de mudança</title><desc id="desc">Quatro cartões apresentam os modelos de arquitetura de negócio consultados pelo arquiteto de solução, mapa de capacidades, fluxo de valor, decomposição funcional e modelo de processo, cada um com a pergunta que responde. Uma faixa inferior mostra os cinco estágios do ciclo de mudança de negócio, alinhar, definir, projetar, implementar e realizar, com definir e projetar destacados.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.q{font-size:17px;fill:#52657E}.e{font-size:16px;font-weight:700}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="70" y="62" class="h">Modelos que localizam a mudança no negócio</text>
  <text x="70" y="86" class="q">O arquiteto de solução consulta os modelos mantidos pela arquitetura de negócio, sem criá-los.</text>

  <rect x="70" y="115" width="245" height="250" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="70" y="115" width="245" height="58" rx="22" fill="#254DB8"/>
  <text x="192" y="152" text-anchor="middle" class="t" style="fill:white">Capacidades</text>
  <text x="90" y="205" class="q">O que a organização</text>
  <text x="90" y="228" class="q">precisa conseguir fazer?</text>
  <text x="90" y="275" class="e">Estratégica</text>
  <text x="90" y="300" class="e">Operacional</text>
  <text x="90" y="325" class="e">De apoio</text>

  <rect x="335" y="115" width="245" height="250" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="335" y="115" width="245" height="58" rx="22" fill="#254DB8"/>
  <text x="457" y="152" text-anchor="middle" class="t" style="fill:white">Fluxo de valor</text>
  <text x="355" y="205" class="q">Por quais etapas o</text>
  <text x="355" y="228" class="q">valor chega ao cliente?</text>
  <rect x="355" y="270" width="55" height="34" rx="8" fill="#5FC0D1"/>
  <rect x="430" y="270" width="55" height="34" rx="8" fill="#5FC0D1"/>
  <rect x="505" y="270" width="55" height="34" rx="8" fill="#5FC0D1"/>
  <path d="M410 287h18M485 287h18" stroke="#16243A" stroke-width="3"/>
  <text x="355" y="335" class="e">Do contato ao valor</text>

  <rect x="600" y="115" width="245" height="250" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="600" y="115" width="245" height="58" rx="22" fill="#254DB8"/>
  <text x="722" y="152" text-anchor="middle" class="t" style="fill:white">Decomposição</text>
  <text x="620" y="205" class="q">Que unidade realiza</text>
  <text x="620" y="228" class="q">cada função?</text>
  <rect x="692" y="258" width="60" height="30" rx="6" fill="#5FC0D1"/>
  <rect x="637" y="318" width="60" height="30" rx="6" fill="#5FC0D1"/>
  <rect x="747" y="318" width="60" height="30" rx="6" fill="#5FC0D1"/>
  <path d="M722 288v15M667 303h110M667 303v15M777 303v15" stroke="#16243A" stroke-width="3" fill="none"/>

  <rect x="865" y="115" width="265" height="250" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/>
  <rect x="865" y="115" width="265" height="58" rx="22" fill="#254DB8"/>
  <text x="997" y="152" text-anchor="middle" class="t" style="fill:white">Processo</text>
  <text x="885" y="205" class="q">Que atividades compõem</text>
  <text x="885" y="228" class="q">o trabalho e quem as faz?</text>
  <text x="885" y="275" class="e">Atividade e responsável</text>
  <text x="885" y="300" class="e">Diretiva que a rege</text>
  <text x="885" y="335" class="q">Lido, não modelado</text>

  <text x="70" y="420" class="t">Ciclo de mudança de negócio</text>
  <rect x="70" y="445" width="190" height="70" rx="18" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <text x="165" y="487" text-anchor="middle" class="t">Alinhar</text>
  <rect x="290" y="445" width="190" height="70" rx="18" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="385" y="487" text-anchor="middle" class="t">Definir</text>
  <rect x="510" y="445" width="190" height="70" rx="18" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="605" y="487" text-anchor="middle" class="t">Projetar</text>
  <rect x="730" y="445" width="190" height="70" rx="18" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <text x="825" y="487" text-anchor="middle" class="t">Implementar</text>
  <rect x="950" y="445" width="180" height="70" rx="18" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <text x="1040" y="487" text-anchor="middle" class="t">Realizar</text>
  <path d="M260 480h28M480 480h28M700 480h28M920 480h28" stroke="#16243A" stroke-width="3"/>
  <text x="70" y="550" class="q">Os estágios destacados concentram o trabalho da arquitetura de solução.</text>

  <rect x="70" y="600" width="1060" height="44" rx="22" fill="#16243A"/>
  <text x="600" y="628" text-anchor="middle" class="e" style="fill:white">Todo componente da solução sustenta um ou mais serviços de negócio</text>
</svg>
