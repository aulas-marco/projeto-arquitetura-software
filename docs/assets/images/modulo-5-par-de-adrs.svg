<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">O par de registros</title>
  <desc id="desc">O ADR de estilo e o ADR de plataforma. O ADR de plataforma faz referência cruzada ao título do ADR de estilo no campo de contexto, e o ADR de estilo cita o ADR de plataforma no campo de revisão quando a prática se firma.</desc>
  <rect width="1000" height="450" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">
    <text x="24" y="46" style="font-size:26px;font-weight:700">O par de registros</text>
    <rect x="24" y="76" width="952" height="120" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="48" y="118" style="font-size:25px;font-weight:700">ADR de estilo</text>
    <rect x="48" y="136" width="150" height="42" rx="10" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <text x="123" y="165" text-anchor="middle" style="font-size:22px;font-weight:700">Revisão</text>
    <rect x="24" y="346" width="952" height="80" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="48" y="396" style="font-size:25px;font-weight:700">ADR de plataforma</text>
    <rect x="520" y="365" width="150" height="42" rx="10" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <text x="595" y="394" text-anchor="middle" style="font-size:22px;font-weight:700">Contexto</text>
    <line x1="123" y1="178" x2="123" y2="334" stroke="#254DB8" stroke-width="4"/>
    <polygon points="113,332 133,332 123,346" fill="#254DB8"/>
    <line x1="595" y1="365" x2="595" y2="208" stroke="#254DB8" stroke-width="4"/>
    <polygon points="585,210 605,210 595,196" fill="#254DB8"/>
    <text x="150" y="232" style="font-size:21px">Quando a prática se firma, o ADR de</text>
    <text x="150" y="262" style="font-size:21px">estilo passa a citar, no campo de</text>
    <text x="150" y="292" style="font-size:21px">revisão, o ADR de plataforma que</text>
    <text x="150" y="322" style="font-size:21px">veio depois</text>
    <text x="622" y="244" style="font-size:21px">Referência cruzada ao título do</text>
    <text x="622" y="274" style="font-size:21px">ADR de estilo, no campo de</text>
    <text x="622" y="304" style="font-size:21px">contexto</text>
  </g>
</svg>
