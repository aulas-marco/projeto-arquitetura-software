<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Processo de remarcação de consulta em BPMN simplificado</title><desc id="desc">Três raias horizontais, paciente, ambulatório e sistema de agendamento. O paciente inicia o processo ao não poder comparecer e telefona ao ambulatório, que registra o pedido. O sistema consulta as vagas e o gateway pergunta se há vaga compatível. Com vaga, o ambulatório escolhe a nova data, o sistema grava a data, o ambulatório emite carta e o paciente a recebe. Sem vaga, o paciente entra na lista de espera.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700;fill:white}.q{font-size:17px;fill:#52657E}.e{font-size:16px}</style>
  <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16243A"/></marker></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/>
  <text x="50" y="52" class="h">Remarcação de consulta, BPMN simplificado</text>

  <rect x="50" y="80" width="1100" height="160" fill="white" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="240" width="1100" height="200" fill="#E6EEF9" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="440" width="1100" height="160" fill="white" stroke="#16243A" stroke-width="2"/>
  <rect x="50" y="80" width="44" height="520" fill="#16243A"/>
  <text transform="translate(78 160) rotate(-90)" text-anchor="middle" class="l">Paciente</text>
  <text transform="translate(78 340) rotate(-90)" text-anchor="middle" class="l">Ambulatório</text>
  <text transform="translate(78 520) rotate(-90)" text-anchor="middle" class="l">Sistema</text>

  <circle cx="140" cy="160" r="22" fill="white" stroke="#16243A" stroke-width="3"/>
  <text x="140" y="210" text-anchor="middle" class="e">Não pode</text>
  <text x="140" y="228" text-anchor="middle" class="e">comparecer</text>
  <rect x="190" y="125" width="170" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="275" y="155" text-anchor="middle" class="e">Telefonar ao</text>
  <text x="275" y="176" text-anchor="middle" class="e">ambulatório</text>

  <rect x="190" y="305" width="170" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="275" y="345" text-anchor="middle" class="e">Registrar pedido</text>

  <rect x="190" y="485" width="170" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="275" y="515" text-anchor="middle" class="e">Consultar vagas</text>
  <text x="275" y="536" text-anchor="middle" class="e">da clínica</text>

  <path d="M162 160H188" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M275 195V303" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M360 340H385V520H362" stroke="#16243A" stroke-width="0" fill="none"/>
  <path d="M275 375V483" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>

  <path d="M470 300L515 340L470 380L425 340Z" fill="#F2B84B" stroke="#16243A" stroke-width="2"/>
  <text x="470" y="347" text-anchor="middle" class="e" style="font-weight:700">?</text>
  <text x="470" y="268" text-anchor="middle" class="e">Há vaga</text>
  <text x="470" y="288" text-anchor="middle" class="e">compatível?</text>
  <path d="M360 520H470V382" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>

  <rect x="580" y="260" width="180" height="62" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="670" y="286" text-anchor="middle" class="e">Escolher nova data</text>
  <text x="670" y="306" text-anchor="middle" class="e">com o paciente</text>
  <path d="M500 326L578 296" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="535" y="296" class="e" style="font-weight:700">sim</text>

  <rect x="580" y="352" width="180" height="62" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="670" y="378" text-anchor="middle" class="e">Incluir na lista</text>
  <text x="670" y="398" text-anchor="middle" class="e">de espera</text>
  <path d="M500 354L578 380" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="530" y="392" class="e" style="font-weight:700">não</text>
  <circle cx="860" cy="383" r="22" fill="white" stroke="#16243A" stroke-width="6"/>
  <path d="M760 383H836" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="860" y="430" text-anchor="middle" class="e">Fim: espera</text>

  <rect x="580" y="485" width="190" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="675" y="515" text-anchor="middle" class="e">Gravar nova data e</text>
  <text x="675" y="536" text-anchor="middle" class="e">liberar vaga anterior</text>
  <path d="M760 291H800V450H675V483" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>

  <rect x="840" y="260" width="170" height="62" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="925" y="286" text-anchor="middle" class="e">Emitir carta de</text>
  <text x="925" y="306" text-anchor="middle" class="e">confirmação</text>
  <path d="M770 520H925V324" stroke="#16243A" stroke-width="2.5" fill="none" marker-end="url(#s)"/>

  <rect x="840" y="125" width="170" height="70" rx="12" fill="#D8E9FF" stroke="#254DB8" stroke-width="2"/>
  <text x="925" y="155" text-anchor="middle" class="e">Receber carta com</text>
  <text x="925" y="176" text-anchor="middle" class="e">a nova data</text>
  <path d="M925 260V197" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <circle cx="1075" cy="160" r="22" fill="white" stroke="#16243A" stroke-width="6"/>
  <path d="M1010 160H1051" stroke="#16243A" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="1075" y="210" text-anchor="middle" class="e">Fim: consulta</text>
  <text x="1075" y="228" text-anchor="middle" class="e">remarcada</text>

  <text x="50" y="632" class="q">Círculo fino: início. Retângulo: tarefa. Losango: gateway de decisão. Círculo espesso: fim.</text>
</svg>
