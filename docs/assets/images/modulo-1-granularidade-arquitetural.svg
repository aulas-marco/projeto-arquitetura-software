<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Granularidade das decisões arquiteturais</title><desc id="desc">Três níveis de escopo conectados mostram arquitetura corporativa, de solução e de software.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52657E}.n{font-size:12px;font-weight:600;fill:#254DB8}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Granularidade define a quem pertence a decisão</text><text x="80" y="89" class="s">A mesma iniciativa atravessa escopos, mas cada decisão tem uma autoridade adequada.</text>
  <rect x="80" y="125" width="1040" height="470" rx="26" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><text x="115" y="167" class="t">Arquitetura corporativa</text><text x="115" y="190" class="s">Organização inteira · princípios, políticas, padrões e capacidades compartilhadas</text>
  <rect x="195" y="226" width="810" height="300" rx="24" fill="#D8E9FF" stroke="#254DB8" stroke-width="3"/><text x="230" y="266" class="t">Arquitetura de solução</text><text x="230" y="289" class="s">Uma mudança completa · negócio, dados, aplicações e impacto operacional</text>
  <rect x="350" y="335" width="500" height="135" rx="20" fill="white" stroke="#5FC0D1" stroke-width="4"/><text x="385" y="376" class="t">Arquitetura de software</text><text x="385" y="399" class="s">Um componente · interfaces e comportamento interno</text>
  <g><rect x="113" y="355" width="54" height="54" rx="12" fill="#F2B84B"/><path d="M128 394V370l12-10 12 10v24M124 394h32M140 360v-12" stroke="#16243A" stroke-width="3" fill="none"/><text x="115" y="439" class="n">Diretriz comum</text></g>
  <g><rect x="248" y="420" width="54" height="54" rx="12" fill="#5FC0D1"/><path d="M262 437h25v21h-25zM268 443h13M268 450h13" stroke="#16243A" stroke-width="3" fill="none"/><text x="226" y="495" class="n">Plano integrado</text></g>
  <g><circle cx="808" cy="404" r="36" fill="#254DB8"/><path d="M790 404h36M808 386v36M796 392l24 24M820 392l-24 24" stroke="white" stroke-width="3"/><text x="746" y="456" class="n">Decisão técnica</text></g>
  <path d="M168 382C220 382 238 408 247 440M304 447C326 447 337 433 348 416" fill="none" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/>
  <g><rect x="90" y="618" width="300" height="30" rx="15" fill="#16243A"/><text x="240" y="639" text-anchor="middle" style="font-size:13px;font-weight:700;fill:white">alcance: organização inteira</text><rect x="450" y="618" width="300" height="30" rx="15" fill="#254DB8"/><text x="600" y="639" text-anchor="middle" style="font-size:13px;font-weight:700;fill:white">alcance: uma solução</text><rect x="810" y="618" width="300" height="30" rx="15" fill="#5FC0D1"/><text x="960" y="639" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#16243A">alcance: um componente</text></g>
</svg>
