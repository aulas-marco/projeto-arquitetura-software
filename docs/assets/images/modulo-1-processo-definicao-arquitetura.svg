<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Artefatos da ACME através das oito fases</title><desc id="d">Os artefatos A1 a A10 percorrem as oito fases do processo. A1, A2 e A4 descrevem a linha de base, e A10 registra a solução implantada.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:24px;font-weight:700}.t{font-size:14px;font-weight:700}.s{font-size:11px;fill:#52657E}.w{font-size:12px;font-weight:700;fill:white}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="62" class="h">Oito fases: cada artefato da ACME aparece no momento certo</text><text x="80" y="86" class="s">A lista A1–A10 do exercício deixa visível a diferença entre entrada, produto intermediário e entregável.</text><path d="M120 212H1080" stroke="#254DB8" stroke-width="4" marker-end="url(#a)"/><g><circle cx="130" cy="212" r="25" fill="#16243A"/><text x="130" y="218" text-anchor="middle" class="w">1</text><text x="130" y="165" text-anchor="middle" class="t">Iniciação</text><rect x="75" y="252" width="110" height="62" rx="12" fill="white" stroke="#16243A" stroke-width="2"/><text x="130" y="278" text-anchor="middle" class="t">A9</text><text x="130" y="298" text-anchor="middle" class="s">autoriza iniciar</text></g><g><circle cx="265" cy="212" r="25" fill="#254DB8"/><text x="265" y="218" text-anchor="middle" class="w">2</text><text x="265" y="165" text-anchor="middle" class="t">Descoberta</text><rect x="195" y="350" width="140" height="78" rx="12" fill="white" stroke="#254DB8" stroke-width="2"/><text x="265" y="377" text-anchor="middle" class="t">A1 · A2 · A4</text><text x="265" y="398" text-anchor="middle" class="s">Linha de base</text><text x="265" y="415" text-anchor="middle" class="s">atores, inventário, decisão</text></g><g><circle cx="400" cy="212" r="25" fill="#5FC0D1"/><text x="400" y="218" text-anchor="middle" class="w">3</text><text x="400" y="158" text-anchor="middle" class="t">Esboço da</text><text x="400" y="174" text-anchor="middle" class="t">solução</text><rect x="345" y="252" width="110" height="62" rx="12" fill="white" stroke="#5FC0D1" stroke-width="2"/><text x="400" y="278" text-anchor="middle" class="t">Alternativas</text><text x="400" y="298" text-anchor="middle" class="s">conceituais</text></g><g><circle cx="535" cy="212" r="25" fill="#F2B84B"/><text x="535" y="218" text-anchor="middle" class="w">4</text><text x="535" y="165" text-anchor="middle" class="t">Análise</text><rect x="468" y="350" width="134" height="78" rx="12" fill="white" stroke="#F2B84B" stroke-width="2"/><text x="535" y="377" text-anchor="middle" class="t">A5 · A3</text><text x="535" y="398" text-anchor="middle" class="s">comparar e escolher</text><text x="535" y="415" text-anchor="middle" class="s">blocos e interfaces</text></g><g><circle cx="670" cy="212" r="25" fill="#16243A"/><text x="670" y="218" text-anchor="middle" class="w">5</text><text x="670" y="165" text-anchor="middle" class="t">Desenho lógico</text><rect x="610" y="252" width="120" height="62" rx="12" fill="white" stroke="#16243A" stroke-width="2"/><text x="670" y="278" text-anchor="middle" class="t">A6</text><text x="670" y="298" text-anchor="middle" class="s">modelo integrado</text></g><g><circle cx="805" cy="212" r="25" fill="#254DB8"/><text x="805" y="218" text-anchor="middle" class="w">6</text><text x="805" y="165" text-anchor="middle" class="t">Validação</text><rect x="745" y="350" width="120" height="78" rx="12" fill="white" stroke="#254DB8" stroke-width="2"/><text x="805" y="377" text-anchor="middle" class="t">A8</text><text x="805" y="398" text-anchor="middle" class="s">lacunas, impacto</text><text x="805" y="415" text-anchor="middle" class="s">e correções</text></g><g><circle cx="940" cy="212" r="25" fill="#5FC0D1"/><text x="940" y="218" text-anchor="middle" class="w">7</text><text x="940" y="158" text-anchor="middle" class="t">Desenvolver</text><text x="940" y="174" text-anchor="middle" class="t">o roteiro</text><rect x="880" y="252" width="120" height="62" rx="12" fill="white" stroke="#5FC0D1" stroke-width="2"/><text x="940" y="278" text-anchor="middle" class="t">A7</text><text x="940" y="298" text-anchor="middle" class="s">marcos e riscos</text></g><g><circle cx="1070" cy="470" r="25" fill="#F2B84B"/><text x="1070" y="476" text-anchor="middle" class="w">8</text><text x="1070" y="516" text-anchor="middle" class="t">Conclusão</text><rect x="1000" y="545" width="140" height="62" rx="12" fill="white" stroke="#F2B84B" stroke-width="2"/><text x="1070" y="571" text-anchor="middle" class="t">A10</text><text x="1070" y="591" text-anchor="middle" class="s">solução implantada</text></g><path d="M1070 237V438" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><path d="M130 470H1038" stroke="#5FC0D1" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/><text x="584" y="460" text-anchor="middle" class="s">governança e decisão de continuar, ajustar escopo ou encerrar</text><text x="80" y="640" class="s">Os códigos são os artefatos do Exercício 4, não novas abstrações a memorizar.</text></svg>
