<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Oito fases do processo de definição da arquitetura</title><desc id="desc">Um processo sequencial percorre iniciação, descoberta, esboço, análise, desenho lógico, validação, roteiro e conclusão. Cada fase entrega informação à seguinte.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:11px;fill:#52657E}.n{font-size:15px;font-weight:700;fill:white}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">O processo de definição da arquitetura</text><text x="80" y="89" class="s">Oito fases transformam uma ideia em solução implantada e entregam o insumo da próxima decisão.</text>
  <path d="M153 270H1047M1047 270v186H153V270" fill="none" stroke="#B8CEE4" stroke-width="5" stroke-linecap="round"/>
  <g><circle cx="153" cy="270" r="30" fill="#16243A"/><text x="153" y="276" text-anchor="middle" class="n">1</text><rect x="88" y="153" width="130" height="81" rx="14" fill="white" stroke="#16243A" stroke-width="3"/><text x="153" y="184" text-anchor="middle" class="t">Iniciação</text><text x="153" y="205" text-anchor="middle" class="s">decidir prosseguir</text></g>
  <g><circle cx="281" cy="270" r="30" fill="#254DB8"/><text x="281" y="276" text-anchor="middle" class="n">2</text><rect x="216" y="306" width="130" height="81" rx="14" fill="white" stroke="#254DB8" stroke-width="3"/><text x="281" y="337" text-anchor="middle" class="t">Descoberta</text><text x="281" y="358" text-anchor="middle" class="s">base factual</text></g>
  <g><circle cx="409" cy="270" r="30" fill="#5FC0D1"/><text x="409" y="276" text-anchor="middle" class="n">3</text><rect x="344" y="153" width="130" height="81" rx="14" fill="white" stroke="#5FC0D1" stroke-width="3"/><text x="409" y="178" text-anchor="middle" class="t">Esboço da</text><text x="409" y="197" text-anchor="middle" class="t">solução</text><text x="409" y="217" text-anchor="middle" class="s">alternativas</text></g>
  <g><circle cx="537" cy="270" r="30" fill="#F2B84B"/><text x="537" y="276" text-anchor="middle" class="n">4</text><rect x="472" y="306" width="130" height="81" rx="14" fill="white" stroke="#F2B84B" stroke-width="3"/><text x="537" y="337" text-anchor="middle" class="t">Análise</text><text x="537" y="358" text-anchor="middle" class="s">opção escolhida</text></g>
  <g><circle cx="665" cy="270" r="30" fill="#16243A"/><text x="665" y="276" text-anchor="middle" class="n">5</text><rect x="600" y="153" width="130" height="81" rx="14" fill="white" stroke="#16243A" stroke-width="3"/><text x="665" y="184" text-anchor="middle" class="t">Desenho lógico</text><text x="665" y="205" text-anchor="middle" class="s">modelo integrado</text></g>
  <g><circle cx="793" cy="270" r="30" fill="#254DB8"/><text x="793" y="276" text-anchor="middle" class="n">6</text><rect x="728" y="306" width="130" height="81" rx="14" fill="white" stroke="#254DB8" stroke-width="3"/><text x="793" y="337" text-anchor="middle" class="t">Validação</text><text x="793" y="358" text-anchor="middle" class="s">impacto e lacunas</text></g>
  <g><circle cx="921" cy="270" r="30" fill="#5FC0D1"/><text x="921" y="276" text-anchor="middle" class="n">7</text><rect x="856" y="153" width="130" height="81" rx="14" fill="white" stroke="#5FC0D1" stroke-width="3"/><text x="921" y="178" text-anchor="middle" class="t">Desenvolver</text><text x="921" y="197" text-anchor="middle" class="t">o roteiro</text><text x="921" y="217" text-anchor="middle" class="s">sequência viável</text></g>
  <g><circle cx="1047" cy="456" r="30" fill="#F2B84B"/><text x="1047" y="462" text-anchor="middle" class="n">8</text><rect x="955" y="490" width="184" height="78" rx="14" fill="white" stroke="#F2B84B" stroke-width="3"/><text x="1047" y="521" text-anchor="middle" class="t">Conclusão</text><text x="1047" y="542" text-anchor="middle" class="s">solução implantada</text></g>
  <path d="M183 270H250M311 270H378M439 270H506M567 270H634M695 270H762M823 270H890M951 270H1047V425" stroke="#254DB8" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M153 456H1007" stroke="#5FC0D1" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#a)"/><text x="575" y="446" text-anchor="middle" class="s">governança e decisão de continuidade em cada fase</text><text x="80" y="630" class="s">O processo pode interromper ou ajustar o escopo quando uma solução aceitável não é viável.</text>
</svg>
