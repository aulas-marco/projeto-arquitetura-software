<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" role="img" aria-labelledby="title desc">
  <title id="title">Template de dez campos do ADR</title>
  <desc id="desc">Os dez campos do template de ADR, título, estado, data, contexto, forças, alternativas, decisão, consequências, evidências e revisão, com forças, alternativas e consequências em destaque por mudarem de forma característica no ADR de plataforma.</desc>
  <rect width="1000" height="592" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">
    <text x="24" y="46" style="font-size:26px;font-weight:700">Template de dez campos do ADR</text>
    <rect x="24" y="76" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="64" cy="112" r="22" fill="#254DB8"/>
    <text x="64" y="120" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">1</text>
    <text x="104" y="121" style="font-size:25px;font-weight:700">Título</text>
    <rect x="24" y="162" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="64" cy="198" r="22" fill="#254DB8"/>
    <text x="64" y="206" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">2</text>
    <text x="104" y="207" style="font-size:25px;font-weight:700">Estado</text>
    <rect x="24" y="248" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="64" cy="284" r="22" fill="#254DB8"/>
    <text x="64" y="292" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">3</text>
    <text x="104" y="293" style="font-size:25px;font-weight:700">Data</text>
    <rect x="24" y="334" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="64" cy="370" r="22" fill="#254DB8"/>
    <text x="64" y="378" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">4</text>
    <text x="104" y="379" style="font-size:25px;font-weight:700">Contexto</text>
    <rect x="24" y="420" width="464" height="72" rx="14" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <circle cx="64" cy="456" r="22" fill="#254DB8"/>
    <text x="64" y="464" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">5</text>
    <text x="104" y="465" style="font-size:25px;font-weight:700">Forças</text>
    <rect x="512" y="76" width="464" height="72" rx="14" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <circle cx="552" cy="112" r="22" fill="#254DB8"/>
    <text x="552" y="120" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">6</text>
    <text x="592" y="121" style="font-size:25px;font-weight:700">Alternativas</text>
    <rect x="512" y="162" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="552" cy="198" r="22" fill="#254DB8"/>
    <text x="552" y="206" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">7</text>
    <text x="592" y="207" style="font-size:25px;font-weight:700">Decisão</text>
    <rect x="512" y="248" width="464" height="72" rx="14" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <circle cx="552" cy="284" r="22" fill="#254DB8"/>
    <text x="552" y="292" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">8</text>
    <text x="592" y="293" style="font-size:25px;font-weight:700">Consequências</text>
    <rect x="512" y="334" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="552" cy="370" r="22" fill="#254DB8"/>
    <text x="552" y="378" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">9</text>
    <text x="592" y="379" style="font-size:25px;font-weight:700">Evidências</text>
    <rect x="512" y="420" width="464" height="72" rx="14" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <circle cx="552" cy="456" r="22" fill="#254DB8"/>
    <text x="552" y="464" text-anchor="middle" style="font-size:22px;font-weight:700" fill="#FFFFFF">10</text>
    <text x="592" y="465" style="font-size:25px;font-weight:700">Revisão</text>
    <rect x="24" y="520" width="44" height="40" rx="10" fill="#FFF7E6" stroke="#F2B84B" stroke-width="3"/>
    <text x="84" y="548" style="font-size:22px">Três campos mudam de forma característica</text>
  </g>
</svg>
