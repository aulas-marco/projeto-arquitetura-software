<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Três sinais de observabilidade sobre as camadas</title>
  <desc id="desc">Três sinais, o registro estruturado de eventos, as métricas e o rastreamento, e uma faixa para o OpenTelemetry, padrão aberto de coleta de métricas e rastros. Abaixo, uma faixa indica que a observabilidade atravessa todas as camadas da plataforma.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#254DB8"/>
    </marker>
  </defs>
  <rect width="1000" height="600" rx="28" fill="#F2F6FB"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243A">
    <text x="24" y="46" style="font-size:26px;font-weight:700">Três sinais atravessam todas as camadas</text>

    <rect x="24" y="80" width="300" height="256" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="44" y="120" style="font-size:24px;font-weight:700">Registro estruturado</text>
    <text x="44" y="150" style="font-size:24px;font-weight:700">de eventos</text>
    <text x="44" y="194" style="font-size:20px">Quando a solução se</text>
    <text x="44" y="222" style="font-size:20px">divide em vários serviços,</text>
    <text x="44" y="250" style="font-size:20px">deixa de existir um</text>
    <text x="44" y="278" style="font-size:20px">registro único onde</text>
    <text x="44" y="306" style="font-size:20px">olhar</text>

    <rect x="350" y="80" width="300" height="256" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="500" y="218" text-anchor="middle" style="font-size:24px;font-weight:700">Métricas</text>

    <rect x="676" y="80" width="300" height="256" rx="16" fill="#FFFFFF" stroke="#254DB8" stroke-width="3"/>
    <text x="696" y="120" style="font-size:24px;font-weight:700">Rastreamento</text>
    <text x="696" y="166" style="font-size:20px">O rastreamento que</text>
    <text x="696" y="194" style="font-size:20px">atravessa os serviços é</text>
    <text x="696" y="222" style="font-size:20px">a forma de responder</text>
    <text x="696" y="250" style="font-size:20px">em que trecho do caminho</text>
    <text x="696" y="278" style="font-size:20px">o tempo foi gasto</text>

    <g stroke="#254DB8" stroke-width="4" fill="none">
      <line x1="174" y1="336" x2="174" y2="464" marker-end="url(#seta)"/>
      <line x1="500" y1="336" x2="500" y2="362" marker-end="url(#seta)"/>
      <line x1="826" y1="336" x2="826" y2="362" marker-end="url(#seta)"/>
    </g>

    <rect x="350" y="368" width="626" height="78" rx="14" fill="#5FC0D1" stroke="#254DB8" stroke-width="3"/>
    <text x="663" y="402" text-anchor="middle" style="font-size:24px;font-weight:700">OpenTelemetry</text>
    <text x="663" y="432" text-anchor="middle" style="font-size:21px">padrão aberto de coleta de métricas e rastros</text>

    <rect x="24" y="470" width="952" height="96" rx="14" fill="#16243A"/>
    <text x="500" y="526" text-anchor="middle" style="font-size:25px;font-weight:700" fill="#FFFFFF">A observabilidade atravessa todas as camadas da plataforma</text>
  </g>
</svg>
