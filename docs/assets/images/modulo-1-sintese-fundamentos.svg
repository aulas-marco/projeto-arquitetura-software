<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Roteiro de recuperação da Aula 1 pelo caso ACME</title><desc id="d">Uma sequência recupera o raciocínio: classificar decisões D1 a D3, projetar a solução para R7, atribuir tarefas T1 a T10 e ordenar os artefatos A1 a A10.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:12px;fill:#52657E}.n{font-size:14px;font-weight:700;fill:#254DB8}</style></defs><rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Síntese: recupere a Aula 1 resolvendo o caso ACME</text><text x="80" y="89" class="s">Se você percorre estas quatro perguntas na ordem, reconstrói a lógica da arquitetura de solução.</text><path d="M180 370H1020" stroke="#254DB8" stroke-width="4" marker-end="url(#a)"/><g><circle cx="205" cy="370" r="52" fill="#16243A"/><text x="205" y="376" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">D1–D3</text><text x="205" y="450" text-anchor="middle" class="t">Classificar o escopo</text><text x="205" y="472" text-anchor="middle" class="s">quem toma a decisão?</text></g><g><circle cx="465" cy="370" r="52" fill="#5FC0D1"/><text x="465" y="376" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16243A">R7</text><text x="465" y="450" text-anchor="middle" class="t">Desenhar a solução</text><text x="465" y="472" text-anchor="middle" class="s">o que muda por inteiro?</text></g><g><circle cx="725" cy="370" r="52" fill="#F2B84B"/><text x="725" y="376" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#16243A">T1–T10</text><text x="725" y="450" text-anchor="middle" class="t">Atribuir responsabilidade</text><text x="725" y="472" text-anchor="middle" class="s">quem executa ou governa?</text></g><g><circle cx="985" cy="370" r="52" fill="#254DB8"/><text x="985" y="376" text-anchor="middle" style="font-size:20px;font-weight:700;fill:white">A1–A10</text><text x="985" y="450" text-anchor="middle" class="t">Situar o artefato</text><text x="985" y="472" text-anchor="middle" class="s">o que entra e o que sai?</text></g><path d="M257 370H405M517 370H665M777 370H925" stroke="#254DB8" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="155" width="700" height="90" rx="22" fill="white" stroke="#254DB8" stroke-width="3"/><text x="600" y="191" text-anchor="middle" class="t">Objetivo do arquiteto de solução</text><text x="600" y="215" text-anchor="middle" class="s">Produzir e governar um plano completo que atende a uma necessidade de negócio.</text><rect x="290" y="560" width="620" height="50" rx="25" fill="#254DB8"/><text x="600" y="591" text-anchor="middle" style="font-size:15px;font-weight:700;fill:white">Aula 2 começa na descoberta: requisitos, restrições e partes interessadas.</text></svg>
