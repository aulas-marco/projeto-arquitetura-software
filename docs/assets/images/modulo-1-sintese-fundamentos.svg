<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de síntese dos fundamentos de arquitetura de solução</title><desc id="desc">Um mapa conceitual liga escopo de decisão, solução como sistema, papel do arquiteto e processo de definição ao resultado de uma solução implementável.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254DB8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#16243A}.h{font-size:25px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:12px;fill:#52657E}.w{font-size:15px;font-weight:700;fill:white}</style></defs>
  <rect width="1200" height="675" rx="28" fill="#F2F6FB"/><text x="80" y="65" class="h">Síntese: os quatro fundamentos operam como um sistema</text><text x="80" y="89" class="s">Use o mapa para reconstituir a lógica da Aula 1 antes de avançar para requisitos e partes interessadas.</text>
  <g><rect x="104" y="153" width="306" height="133" rx="22" fill="#E6EEF9" stroke="#16243A" stroke-width="3"/><text x="139" y="190" class="t">1. Escopo da decisão</text><text x="139" y="215" class="s">corporativa · solução · software</text><text x="139" y="242" class="s">define autoridade e alcance</text></g><g><rect x="790" y="153" width="306" height="133" rx="22" fill="#EAF8FB" stroke="#5FC0D1" stroke-width="3"/><text x="825" y="190" class="t">2. Solução como sistema</text><text x="825" y="215" class="s">pessoas, estrutura, processo,</text><text x="825" y="237" class="s">informação e tecnologia</text></g><g><rect x="104" y="407" width="306" height="133" rx="22" fill="#FFF5DE" stroke="#F2B84B" stroke-width="3"/><text x="139" y="444" class="t">3. Papel do arquiteto</text><text x="139" y="469" class="s">equilibra negócio, técnica,</text><text x="139" y="491" class="s">entrega e prática</text></g><g><rect x="790" y="407" width="306" height="133" rx="22" fill="#EAF0FF" stroke="#254DB8" stroke-width="3"/><text x="825" y="444" class="t">4. Processo</text><text x="825" y="469" class="s">oito fases transformam</text><text x="825" y="491" class="s">incerteza em decisão</text></g>
  <path d="M410 220H480M720 220H790M410 473H480M720 473H790M250 286V365M950 286V365" stroke="#254DB8" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <circle cx="600" cy="347" r="139" fill="#16243A"/><circle cx="600" cy="347" r="109" fill="#254DB8"/><path d="M555 347h90M600 302v90M568 315l64 64M632 315l-64 64" stroke="#5FC0D1" stroke-width="5"/><text x="600" y="425" text-anchor="middle" class="w">Solução implementável</text><text x="600" y="448" text-anchor="middle" style="font-size:12px;fill:#D7E7FF">desenho, roteiro e estimativa</text>
  <rect x="335" y="588" width="530" height="40" rx="20" fill="#F2B84B"/><text x="600" y="614" text-anchor="middle" style="font-size:14px;font-weight:700">Próxima aula: requisitos, restrições e partes interessadas alimentam a descoberta</text>
</svg>
