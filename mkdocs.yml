site_name: Projeto e Inovação em Arquitetura de Soluções
site_url: https://aulas-marco.github.io/projeto-arquitetura-software/
site_description: Material de disciplina de pós-graduação em projeto e inovação em arquitetura de soluções, em seis aulas síncronas
use_directory_urls: true
exclude_docs: |
  superpowers/**

hooks:
  - scripts/caderno_hooks.py

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  - redirects:
      redirect_maps:
        modulo-1-fundamentos/bloco-1-arquitetura-e-papel-do-arquiteto.md: modulo-1-fundamentos/bloco-1-arquitetura-de-solucoes-e-de-software.md
        modulo-1-fundamentos/bloco-2-qualidade-e-tipos-de-requisito.md: modulo-2-requisitos-e-partes-interessadas/bloco-2-qualidade-e-tipos-de-requisito.md
        modulo-1-fundamentos/bloco-3-cenarios-e-significancia-arquitetural.md: modulo-2-requisitos-e-partes-interessadas/bloco-3-cenarios-linha-de-base-e-restricoes.md
        modulo-1-fundamentos/bloco-4-estilos-arquiteturais.md: modulo-3-design-e-padroes/bloco-2-estilos-arquiteturais.md
        modulo-2-plataforma-e-modelos/index.md: modulo-2-requisitos-e-partes-interessadas/index.md
        modulo-2-plataforma-e-modelos/sintese.md: modulo-2-requisitos-e-partes-interessadas/sintese.md
        modulo-2-plataforma-e-modelos/bloco-1-registro-de-decisao-arquitetural.md: modulo-3-design-e-padroes/bloco-4-registro-de-decisao-arquitetural.md
        modulo-5-frameworks-e-tecnologias/bloco-3-seguranca-fim-a-fim.md: modulo-5-frameworks-e-tecnologias/bloco-3-seguranca-ponta-a-ponta.md
        modulo-2-plataforma-e-modelos/bloco-2-plataforma-arquitetural.md: modulo-5-frameworks-e-tecnologias/bloco-2-plataforma-arquitetural.md
        modulo-2-plataforma-e-modelos/bloco-3-adr-de-plataforma.md: modulo-5-frameworks-e-tecnologias/bloco-4-adr-de-plataforma.md
        modulo-2-plataforma-e-modelos/bloco-4-representacao-de-modelos-e-c4.md: modulo-4-dominios-da-solucao/bloco-3-arquitetura-de-aplicacoes-e-integracao.md
        modulo-3-aplicacao-e-servicos/index.md: modulo-3-design-e-padroes/index.md
        modulo-4-integracao-e-dados/index.md: modulo-4-dominios-da-solucao/index.md
        modulo-4-protocolos-e-representacao/index.md: modulo-4-dominios-da-solucao/index.md
        modulo-4-protocolos-e-representacao/bloco-4-representacao-de-modelos-e-c4.md: modulo-4-dominios-da-solucao/bloco-3-arquitetura-de-aplicacoes-e-integracao.md
        modulo-5-seguranca-e-trm/index.md: modulo-5-frameworks-e-tecnologias/index.md
        modulo-6-riscos-e-provas-de-conceito/index.md: modulo-6-governanca-ia-e-caderno/index.md

extra_css:
  - assets/stylesheets/extra.css?v=20261016-4

extra_javascript:
  - assets/javascripts/mermaid.mjs
  - assets/javascripts/caderno.js

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

